version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]
    ignore:
      # jsonwebtoken 10+ needs its own crypto backend (aws-lc-rs, or rust_crypto which
      # brings the unfixed RUSTSEC-2023-0071 `rsa`); 9 verifies with `ring`, which the
      # workspace already links for DPoP and the audit checkpoints. Stay on 9 until the
      # token crate's JWT handling is reviewed as a whole.
      - dependency-name: jsonwebtoken
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "rust"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
    labels: ["dependencies", "docker"]

  # The hash-pinned release tooling for the Python package (SR-83): Dependabot recompiles
  # sdk/python/release-requirements.txt from release-requirements.in with pip-compile and the
  # options in its header. It also reads sdk/python/pyproject.toml here.
  - package-ecosystem: pip
    directory: "/sdk/python"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      release-tooling:
        patterns: ["*"]
    labels: ["dependencies", "python"]
