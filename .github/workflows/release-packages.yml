# Publishes the SDKs: the Python package `attenuo` to PyPI and `@attenuo/sdk` to npm. Not yet
# exercised: GitHub Actions are blocked on billing, so this file was checked locally only.
#
# Triggers
#   - push of a `v*` tag: a DRY RUN only. Both packages are built, tested and checked, and
#     nothing is uploaded, so tagging a release never publishes a package by accident.
#   - workflow_dispatch: inputs `package` (python, typescript or both) and `dry_run` (default
#     true). Only a dispatch with `dry_run=false` publishes, and only from a `v*` tag whose
#     version equals the package's (dispatch with `--ref v0.1.0`). From a branch it fails.
#
#   gh workflow run release-packages.yml --ref v0.1.0 -f package=python -f dry_run=false
#   gh workflow run release-packages.yml --ref v0.1.0 -f package=typescript -f dry_run=false
#
# Publishing
#   - PyPI: trusted publishing (OIDC), no token. The PyPI project must list this repository,
#     workflow `release-packages.yml` and environment `pypi` as a trusted publisher. The
#     upload job builds nothing: it uploads the files the check job built and checked.
#   - npm: `npm publish --provenance --access public` with `NODE_AUTH_TOKEN` from the `npm`
#     environment's `NPM_TOKEN` secret. The provenance statement is signed with the job's OIDC
#     token (`id-token: write`).
#   Both publish jobs run in a GitHub environment (`pypi`, `npm`), so a required reviewer can be
#   set on each. One-time setup and the manual fallback: docs/release/0.1.0.md, "Publish the SDKs".
#
# Every action is pinned to a full commit SHA, the tag it was taken from in the comment (SR-30);
# checkout, setup-python, setup-node and the artifact actions use the pins of the other workflows.

name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package:
        description: Which package to build (and publish, when dry_run is false)
        type: choice
        options: [both, python, typescript]
        default: both
      dry_run:
        description: Build and check only; upload nothing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  # True only for a dispatch that turned dry_run off. A tag push has no inputs and is a dry run.
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}

jobs:
  python:
    name: Python package (build and check)
    if: github.event_name == 'push' || inputs.package != 'typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' build twine
      - name: Version matches the tag
        if: env.PUBLISH == 'true' || github.ref_type == 'tag'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ $REF_TYPE != tag || $REF_NAME != "v$version" ]]; then
            echo "::error::publishing needs the tag v$version (ref: $REF_TYPE $REF_NAME)"
            exit 1
          fi
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: pytest -q
      - run: python -m build --outdir dist .
      - run: twine check --strict dist/*
      - name: The wheel holds only the package
        run: |
          set -euo pipefail
          python -m zipfile -l dist/*.whl | awk 'NR > 1 { print $1 }' > wheel-files.txt
          if grep -v -E '^attenuo/|^attenuo-[^/]+\.dist-info/' wheel-files.txt; then
            echo "::error::files outside the package in the wheel (above)"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: sdk/python/dist/
          if-no-files-found: error

  python-publish:
    name: Publish to PyPI
    needs: python
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.package != 'typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/attenuo/
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  typescript:
    name: npm package (build, test and check)
    if: github.event_name == 'push' || inputs.package != 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Version matches the tag
        if: env.PUBLISH == 'true' || github.ref_type == 'tag'
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          if [[ $REF_TYPE != tag || $REF_NAME != "v$version" ]]; then
            echo "::error::publishing needs the tag v$version (ref: $REF_TYPE $REF_NAME)"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  typescript-publish:
    name: Publish to npm
    needs: typescript
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.package != 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@attenuo/sdk
    permissions:
      contents: read
      id-token: write # npm provenance
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here: what is published is built from a clean install of the lockfile.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # `prepack` runs the build, so the tarball holds a fresh dist/.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
