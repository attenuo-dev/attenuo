# Release workflow. Not yet exercised: no tag has been pushed.
#
# Trigger: pushing a tag `vX.Y.Z[-suffix]` (see "Releases" in CONTRIBUTING.md).
#
# What it does
#   1. builds `attenuo` and `attenuo-server` for Linux x86_64/aarch64 (musl, static)
#      and macOS arm64/x86_64 and packs one .tar.gz per target
#   2. builds a multi-arch (amd64, arm64) image from the Dockerfile, pushes it to
#      ghcr.io/<owner>/<repo> tagged with the version and `latest`, signs it with cosign
#      (keyless, GitHub OIDC) and attaches an SPDX SBOM (anchore/sbom-action, also attested
#      to the image with cosign)
#   3. writes SHA256SUMS over all archives and the SBOM, renders this release's changelog
#      section with git-cliff, and creates a DRAFT GitHub release. A maintainer reviews the
#      draft and publishes it by hand.
#
# Every action is pinned to a full commit SHA (the tag it was taken from is in the comment):
# this workflow can push and sign images and create releases, so a moved tag in a third-party
# action must not be able to run here (SR-30). Bump pins deliberately, after reading the diff.
#
# Secrets: none beyond the automatic GITHUB_TOKEN. Keyless cosign needs no key; it uses the
# job's OIDC token (`id-token: write`). GHCR needs `packages: write`, granted below. After the
# first push, set the package visibility to public in the repository's Packages settings.
#
# Verify a published image:
#   cosign verify ghcr.io/attenuo-dev/attenuo:<version> \
#     --certificate-identity-regexp '^https://github.com/attenuo-dev/attenuo/\.github/workflows/release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Before relying on it: run it once against a `v0.0.0-test` tag on a fork and delete the tag
# and the draft. crates.io publishing is intentionally not here (see CONTRIBUTING.md).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm # native arm64 runner, so no cross toolchain
            musl: true
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest # cross-compiled with the Xcode SDK
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit of the `stable` branch, so the toolchain is named explicitly. No
      # cargo cache: release builds start clean, so nothing another workflow saved can end up
      # in a signed artifact.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p attenuo-server -p attenuo-cli
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="attenuo-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/attenuo" \
             "target/${{ matrix.target }}/release/attenuo-server" \
             LICENSE README.md CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  image:
    name: Container image (GHCR, cosign, SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image (keyless)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            cosign sign --yes "${tag%%:*}@${DIGEST}"
          done
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: attenuo-image.spdx.json
          artifact-name: sbom
          upload-release-assets: false
      - name: Attest the SBOM to the image
        run: |
          cosign attest --yes --type spdxjson --predicate attenuo-image.spdx.json \
            "${IMAGE}@${{ steps.build.outputs.digest }}"

  release:
    name: Draft GitHub release
    needs: [build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the tag history
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum *.tar.gz *.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - name: Changelog section (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS
