name: TypeScript SDK
on:
  push:
    branches: [main]
    paths:
      - "sdk/typescript/**"
      - "examples/typescript-agent/**"
      - ".github/workflows/sdk-typescript.yml"
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "examples/typescript-agent/**"
      - ".github/workflows/sdk-typescript.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Lint, build and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Smoke-test the CJS and ESM builds
        run: |
          node -e "const s = require('./dist/index.cjs'); if (typeof s.OnbehalfClient !== 'function') process.exit(1)"
          node --input-type=module -e "import('./dist/index.js').then((s) => { if (typeof s.OnbehalfClient !== 'function') process.exit(1) })"

  integration:
    name: Integration (real server, fake MCP upstream, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            examples/typescript-agent/package-lock.json
      - name: Build the server and the fake MCP upstream
        run: |
          cargo build -p onbehalf-server -p onbehalf-cli
          cargo build -p onbehalf-proxy --example fake_mcp
          mkdir -p .bin/examples
          cp target/debug/onbehalf-server .bin/
          cp target/debug/examples/fake_mcp .bin/examples/
      - run: npm ci && npm run build
        working-directory: sdk/typescript
      - run: npm ci && npm run typecheck
        working-directory: examples/typescript-agent
      - run: npm test
        working-directory: sdk/typescript
        env:
          ONBEHALF_INTEGRATION: "1"
