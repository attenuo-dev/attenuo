name: TypeScript SDK
on:
  push:
    branches: [main]
    paths:
      - "sdk/typescript/**"
      - "examples/typescript-agent/**"
      - ".github/workflows/sdk-typescript.yml"
  pull_request:
    paths:
      - "sdk/typescript/**"
      - "examples/typescript-agent/**"
      - ".github/workflows/sdk-typescript.yml"

permissions:
  contents: read

# A newer push to the same PR supersedes the running run; main runs are not cancelled.
concurrency:
  group: sdk-typescript-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  unit:
    name: Lint, build and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Smoke-test the CJS and ESM builds
        run: |
          node -e "const s = require('./dist/index.cjs'); if (typeof s.AttenuoClient !== 'function') process.exit(1)"
          node --input-type=module -e "import('./dist/index.js').then((s) => { if (typeof s.AttenuoClient !== 'function') process.exit(1) })"

  integration:
    name: Integration (real server, fake MCP upstream, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Both Node legs build the same Rust binaries, so they share one cache, written on main
      # by the Node 22 leg only.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: sdk-typescript-integration
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.node == '22' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            sdk/typescript/package-lock.json
            examples/typescript-agent/package-lock.json
      - name: Build the server and the fake MCP upstream
        run: |
          cargo build --locked -p attenuo-server -p attenuo-cli
          cargo build --locked -p attenuo-proxy --example fake_mcp
          mkdir -p .bin/examples
          cp target/debug/attenuo-server .bin/
          cp target/debug/examples/fake_mcp .bin/examples/
      - run: npm ci && npm run build
        working-directory: sdk/typescript
      - run: npm ci && npm run typecheck
        working-directory: examples/typescript-agent
      - run: npm test
        working-directory: sdk/typescript
        env:
          ATTENUO_INTEGRATION: "1"
