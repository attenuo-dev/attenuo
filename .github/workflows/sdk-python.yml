name: Python SDK
on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "examples/python-agent/**"
      # tests/test_readme_snippets.py: the README's SDK section, run against the example config.
      - "README.md"
      - "config/example.toml"
      - ".github/workflows/sdk-python.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - "examples/python-agent/**"
      # tests/test_readme_snippets.py: the README's SDK section, run against the example config.
      - "README.md"
      - "config/example.toml"
      - ".github/workflows/sdk-python.yml"

permissions:
  contents: read

# A newer push to the same PR supersedes the running run; main runs are not cancelled.
concurrency:
  group: sdk-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  unit:
    name: Lint, types and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check --config pyproject.toml . ../../examples/python-agent
      - run: ruff format --check --config pyproject.toml . ../../examples/python-agent
      - run: mypy --strict src tests ../../examples/python-agent
      - run: pytest

  integration:
    name: Integration (real server, fake MCP upstream)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Written on main only; a pull request restores main's cache and saves nothing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: pip install -e 'sdk/python[dev]' mcp
      - run: pytest -m integration
        working-directory: sdk/python
        env:
          ATTENUO_INTEGRATION: "1"
