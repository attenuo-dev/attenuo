name: Python SDK
on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "examples/python-agent/**"
      - ".github/workflows/sdk-python.yml"
  pull_request:
    paths:
      - "sdk/python/**"
      - "examples/python-agent/**"
      - ".github/workflows/sdk-python.yml"

permissions:
  contents: read

jobs:
  unit:
    name: Lint, types and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check --config pyproject.toml . ../../examples/python-agent
      - run: ruff format --check --config pyproject.toml . ../../examples/python-agent
      - run: mypy --strict src tests ../../examples/python-agent
      - run: pytest

  integration:
    name: Integration (real server, fake MCP upstream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - run: pip install -e 'sdk/python[dev]' mcp
      - run: pytest -m integration
        working-directory: sdk/python
        env:
          ATTENUO_INTEGRATION: "1"
