name: CI

# Where each check runs (docs/research/ci-minutes-2026-11-05.md has the numbers):
# - every pull request: everything below except the macOS tests, the nightly fuzz build and
#   the docker compose demo (those two run on a pull request that changes their files); a pull
#   request that only touches documentation (see the `changes` job) runs only the link check.
# - every push to main: the same, plus the nightly fuzz build and the docker compose demo.
# - weekly (Monday) and on manual dispatch: everything, including the macOS tests.
# macOS minutes are billed at 10x on a private repository and the hosted macOS arm64 pool often
# cannot start the job within 15 minutes, so macOS is weekly, not per push.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:
    inputs:
      macos-runner:
        description: Runner for the macOS test job (macos-15-intel when the arm64 pool is short)
        type: choice
        options: [macos-latest, macos-15-intel]
        default: macos-latest

# Least privilege by default; jobs that need more say so.
permissions:
  contents: read

# A newer push to the same PR or branch supersedes the running run. The event name is part of
# the group so a push to main does not cancel the weekly or a dispatched run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  # Warnings fail the build once, here, for every stable job on Linux. The same value in every
  # job also keeps the shared cargo cache key identical. MSRV, nightly fuzz and macOS reset it.
  RUSTFLAGS: -D warnings

jobs:
  # Decides whether the Rust jobs run. On a pull request it lists the changed files through the
  # API (no checkout); everything else (main, weekly, dispatch) always runs the Rust jobs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the PR files API
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      fuzz: ${{ github.event_name != 'pull_request' || steps.filter.outputs.fuzz == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `rust` is true when any changed file is outside the documentation-only paths.
          predicate-quantifier: every
          filters: |
            rust:
              - "**"
              - "!docs/**"
              - "!**/*.md"
              - "!assets/**"
              - "!book.toml"
              - "!book-theme/**"
              - "!.github/ISSUE_TEMPLATE/**"
            # `predicate-quantifier: every` applies to this filter too, so the two paths
            # are one brace pattern: a file matches when it is under fuzz/ or is this file.
            fuzz:
              - "{fuzz/**,.github/workflows/ci.yml}"
            # The image and compose files, the compose demo's config and its test.
            docker:
              - "{Dockerfile,.dockerignore,docker-compose.yml,examples/github-leak-demo/config.docker.toml,scripts/compose-smoke.sh,.github/workflows/ci.yml}"

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      # Caches are written on main only; a pull request restores main's and saves nothing.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The test, demo, policy-tests and console-browser jobs build the same debug dependencies with
  # the same flags, so they share one cache (`shared-key: debug`), written by this job on main.
  test:
    name: test (ubuntu-latest, stable)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Property tests replay one fixed sequence in CI, so a red run is reproducible and not
    # flaky; locally the seed is random and printed on failure (CONTRIBUTING.md, "Property
    # tests"). Change the seed on purpose to explore a new sequence.
    env:
      PROPTEST_RNG_SEED: "20261024"
      PROPTEST_CASES: "1024"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Build first, in its own step, so the log shows compile time and test time apart.
      - run: cargo test --workspace --locked --no-run
      - run: cargo test --workspace --locked

  # The same tests on macOS (SDK and CLI users run it), weekly and on manual dispatch only. It
  # needs no other job and no job needs it, so a queued-out or red macOS run never hides or
  # blocks the Linux result. Warnings are not fatal here, as before; clippy covers them on Linux.
  test-macos:
    # A static name: a job name with an expression over `inputs` shows the raw expression in
    # the checks list when the job is skipped. The chosen runner is in the job's `runs-on`.
    name: test (macos, stable)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ inputs.macos-runner || 'macos-latest' }}
    # Counts from the moment a runner picks the job up; queue time is not billed.
    timeout-minutes: 45
    env:
      RUSTFLAGS: ""
      PROPTEST_RNG_SEED: "20261024"
      PROPTEST_CASES: "1024"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  msrv:
    name: msrv (rust-version from Cargo.toml)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # An older compiler warns differently; the MSRV check is about compiling, as before.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the declared rust-version
        id: msrv
        run: |
          v="$(sed -n -E 's/^rust-version *= *"([0-9.]+)".*/\1/p' Cargo.toml | head -n1)"
          test -n "$v" || { echo "no rust-version in Cargo.toml" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # dtolnay/rust-toolchain publishes no major tags; @master takes the toolchain as an input.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-23
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `+<version>`: rust-toolchain.toml pins the release CI otherwise uses, and it takes
      # precedence over the toolchain the step above made the default.
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A prebuilt cargo-deny in a container image; nothing is compiled.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # rustsec/audit-check compiled cargo-audit from source on every run (about 6 of its 5.2 to 6
  # minutes). install-action fetches the upstream release binary and checks its digest instead.
  # `cargo audit` fails on a vulnerability and prints unmaintained/yanked warnings, as before;
  # the results are in the log rather than in a separate "Security audit" check run.
  audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file Cargo.lock

  demo:
    name: GitHub leak demo
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          save-if: false
      # and exits non-zero if any step of the scenario does not come out as expected.
      - run: bash examples/github-leak-demo/run.sh
      # The multi-hop delegation demo (planner -> coder -> GitHub tool), the same way: it reuses
      # the binaries built above and fails on any step, audit count or upstream count that differs.
      - name: Multi-hop delegation demo
        run: bash examples/multi-hop-demo/run.sh
      # Hop 0 from an ID token: a mock OIDC IdP (the server's mock_idp example), POST /token with
      # the dev mint off, one exchange, one allowed and one denied call. Same checks as above.
      - name: IdP exchange demo
        run: bash examples/idp-exchange-demo/run.sh
      # The admin console listener against the real binary: page and CSP, admin token, no dev mint.
      - name: Admin console smoke test
        run: bash scripts/admin-ui-smoke.sh

  # Builds the release and demo images and plays the leak demo through docker-compose.yml
  # (scripts/compose-smoke.sh): release image contents, `attenuo health` as the HEALTHCHECK, the
  # admin listener unpublished. A release build of the workspace, so on pull requests only when
  # the Docker files change; always on main, weekly and on dispatch.
  compose:
    name: docker compose demo
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/compose-smoke.sh

  # The admin console in headless Chromium: every page in both themes, with zero console
  # errors and CSP violations allowed (scripts/console-smoke.sh, tests/console/).
  console-browser:
    name: admin console in a browser
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/console/package-lock.json
      # Playwright is pinned in tests/console/package.json; install the Chromium it expects.
      - name: Install Playwright and its Chromium
        working-directory: tests/console
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Console browser smoke test
        env:
          CONSOLE_SMOKE_SHOTS: ${{ runner.temp }}/console-screenshots
        run: bash scripts/console-smoke.sh
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-screenshots
          path: ${{ runner.temp }}/console-screenshots
          if-no-files-found: ignore

  policy-tests:
    name: policy tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          save-if: false
      - name: attenuo policy test
        run: cargo run --locked -q -p attenuo-cli -- policy test examples/github-leak-demo/policy_test.yaml examples/multi-hop-demo/policy_test.yaml
      - name: attenuo policy test (config/policies)
        run: cargo run --locked -q -p attenuo-cli -- policy test --fail-on-unexercised config/policies/*_test.yaml

  # Compiles every fuzz target and example on stable with `--cfg fuzzing` (as cargo-fuzz sets
  # it), against fuzz/Cargo.lock with `--locked`, on every pull request that can change Rust. A
  # library change that breaks a fuzz target, or leaves the fuzz crate's lockfile stale, fails
  # here; the nightly build below runs on fewer events and cargo-fuzz has no `--locked`.
  fuzz-check:
    name: fuzz targets compile (stable)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: --cfg fuzzing -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --manifest-path fuzz/Cargo.toml --bins --examples --locked

  # Builds the cargo-fuzz targets (nightly, outside the workspace) and runs each over its seed
  # corpus once, so a seed that crashes fails CI. Long fuzzing runs are manual; see
  # docs/design/fuzzing.md. Runs on main, weekly, on dispatch, and on a pull request that changes
  # fuzz/ or this workflow; `fuzz-check` above catches a target that stops compiling sooner.
  fuzz-build:
    name: fuzz targets build
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # cargo-fuzz sets its own flags for the instrumented build.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # dtolnay/rust-toolchain publishes no major tags; @master takes the toolchain as an input.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-23
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - run: cargo +nightly fuzz build
      - name: Seed corpus and one pass over it
        run: |
          cargo +nightly run -q --manifest-path fuzz/Cargo.toml --example seed_corpus
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" -- -runs=0
          done

  # The Markdown link check runs on every pull request, documentation-only ones included;
  # rustdoc runs when Rust can have changed.
  docs:
    name: docs (rustdoc and links)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative links in Markdown
        run: python3 scripts/check-links.py
      - name: Check public hygiene of the tracked tree
        run: python3 scripts/check-public-hygiene.py
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.changes.outputs.rust == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.rust == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: needs.changes.outputs.rust == 'true'
        run: cargo doc --workspace --no-deps --locked

  # The one check to mark as required once branch protection is on. A job skipped on purpose
  # (docs-only pull request, fuzz on a pull request) counts as passed; a failed or cancelled one
  # fails this. Branch protection itself counts any skipped job as passed, including one skipped
  # because `changes` failed, so the individual jobs must not be the required checks. This job
  # always runs. The macOS job is left out on purpose (weekly, and its pool can queue it out).
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, fmt, clippy, test, msrv, deny, audit, demo, compose, console-browser, policy-tests, fuzz-check, fuzz-build, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All needed jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a needed job ended as: $r" >&2; exit 1 ;;
            esac
          done
