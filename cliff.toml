# git-cliff configuration. https://git-cliff.org/docs/configuration
#
# Produces a Keep a Changelog style draft from Conventional Commits.
# Usage:
#   git cliff --unreleased            # draft the Unreleased section
#   git cliff --tag v0.2.1            # preview the next release section
# The output is edited by hand into CHANGELOG.md; it is not committed verbatim.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {% if commit.breaking %}**BREAKING:** {% endif %}\
  {{ commit.message | upper_first | trim }}\
  {% if commit.breaking and commit.breaking_description %}\n  {{ commit.breaking_description | trim }}{% endif %}
{%- endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
  {% if release.version -%}
    {% if release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/attenuo-dev/attenuo/compare/{{ release.previous.version }}...{{ release.version }}
    {% endif -%}
  {% else -%}
[Unreleased]: https://github.com/attenuo-dev/attenuo/compare/{{ release.previous.version }}...HEAD
  {% endif -%}
{% endfor %}
"""
trim = true
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = "rc|beta|alpha"
topo_order = false
sort_commits = "oldest"
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/attenuo-dev/attenuo/issues/$1" },
  { pattern = "RUSTSEC-(\\d{4})-(\\d+)", href = "https://rustsec.org/advisories/RUSTSEC-$1-$2" },
  { pattern = "ADR-(\\d{4})", href = "https://github.com/attenuo-dev/attenuo/blob/main/docs/decisions/$1" },
]
commit_preprocessors = [
  # Turn the "(#123)" that GitHub squash merges append into a PR link. Works
  # offline; no GitHub token needed.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/attenuo-dev/attenuo/pull/${1}))" },
]
# Order matters: the first matching parser wins. Groups are prefixed with an
# HTML comment carrying a sort key so they come out in Keep a Changelog order;
# `striptags` in the template removes it.
commit_parsers = [
  { message = "^(feat|fix|perf|refactor|chore|docs|build|ci|test)\\(deps\\)", group = "<!-- 6 -->Dependencies" },
  { body = ".*security", group = "<!-- 5 -->Security" },
  { footer = "^RUSTSEC-", group = "<!-- 5 -->Security" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { message = "^docs", group = "<!-- 7 -->Documentation" },
  { message = "^(chore|build|ci|style)\\(release\\)", skip = true },
  { message = "^(chore|build|ci|style|test)", skip = true },
  { message = "^deprecat", group = "<!-- 2 -->Deprecated" },
  { message = ".*", group = "<!-- 1 -->Changed" },
]
