[package]
name = "attenuo-policy"
description = "Policy decision point for attenuo: capability check plus Cedar policies over delegation chains"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["authorization", "cedar", "policy", "agents", "mcp"]
categories = ["authentication"]

[dependencies]
attenuo-core = { workspace = true }
cedar-policy = { workspace = true, features = ["partial-eval"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
serde_yaml = { workspace = true }
miette = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "authorize"
harness = false

[[bench]]
name = "policy_stage"
harness = false

[[bench]]
name = "list_screen"
harness = false
