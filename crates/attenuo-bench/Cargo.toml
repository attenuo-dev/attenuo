[package]
name = "attenuo-bench"
description = "End-to-end latency and throughput benchmark for attenuo: proxy versus direct-to-upstream tools/call"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
readme = "README.md"

[lib]
path = "src/lib.rs"

[[bin]]
name = "attenuo-bench"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
hdrhistogram = { version = "7", default-features = false }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Paused time for the open-loop scheduler tests.
tokio = { workspace = true, features = ["test-util"] }
