[package]
name = "attenuo-audit"
description = "Tamper-evident, hash-chained decision log and lease registry for attenuo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["audit", "hash-chain", "tamper-evident", "sqlite", "agents"]
categories = ["authentication", "database"]

[features]
default = []
# Test-only hooks (parking the WAL checkpointer, WAL checkpoint timings) for this crate's own
# integration tests and measurements.
testing = []

[dependencies]
attenuo-core = { workspace = true }
attenuo-token = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
rusqlite = { workspace = true }
ring = { workspace = true }

[dev-dependencies]
# Enables the `testing` hooks for this crate's own integration tests.
attenuo-audit = { path = ".", features = ["testing"] }
tempfile = { workspace = true }
proptest = { workspace = true }
