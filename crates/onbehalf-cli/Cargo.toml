[package]
name = "onbehalf-cli"
description = "The `onbehalf` command line: mint, exchange and inspect delegation tokens, call tools through the proxy, and administer a running onbehalf server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "onbehalf"
path = "src/main.rs"

[dependencies]
onbehalf-core = { workspace = true }
onbehalf-token = { workspace = true }
onbehalf-audit = { workspace = true }
onbehalf-policy = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["env"] }
reqwest = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
