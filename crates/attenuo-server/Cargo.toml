[package]
name = "attenuo-server"
description = "The attenuo server: token exchange, AuthZEN PDP, MCP proxy and audit log in one process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["mcp", "authorization", "authzen", "rfc8693", "agents"]
categories = ["authentication", "web-programming::http-server"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "attenuo-server"
path = "src/main.rs"

[features]
# OpenTelemetry trace export (`[telemetry]`). On by default, so the release binary and the
# image carry it and export stays a config switch; `--no-default-features` builds a server
# without the OpenTelemetry crates, which then refuses `[telemetry] enabled = true`.
default = ["otel"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-http",
    "dep:tracing-opentelemetry",
]
# Wrappers over crate-private ceiling code for the cargo-fuzz targets in `fuzz/`. Not an API.
fuzzing = []

[dependencies]
attenuo-core = { workspace = true }
attenuo-token = { workspace = true }
attenuo-policy = { workspace = true }
attenuo-audit = { workspace = true }
attenuo-proxy = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
http-body = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server", "http1"] }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
# `[server.tls]`: the main listener's TLS (`src/tls.rs`, `src/listen.rs`). The versions and the
# `ring` provider reqwest already brings in.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
form_urlencoded = { workspace = true }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-http = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
uuid = { workspace = true }

# The effective uid, without `unsafe`, for the `[server.tls]` key file's owner check
# (`src/tls.rs`). Already in the lock file through tempfile and the other workspace crates.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
criterion = { workspace = true }
# `SqliteLeaseStore::write_turns`, for the write count of the `allowed_call` bench and tests.
attenuo-audit = { workspace = true, features = ["testing"] }
attenuo-proxy = { workspace = true, features = ["testing"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }
# A test CA, its certificates and an HTTPS key server, for `[[idps]]` / `[[actor_trust]]`
# `ca_pem_path` (tests/key_url_ca.rs and the unit tests of `idp::jwks`), and the server
# certificates of the `[server.tls]` tests (tests/server_tls.rs, the unit tests of `tls`).
rcgen = { workspace = true }
# Paused time (`tokio::time::pause`) for the stream re-check test in `tests/e2e.rs`.
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "decide"
harness = false

[[bench]]
name = "allowed_call"
harness = false

[[bench]]
name = "audit_reads"
harness = false

[[bench]]
name = "token_cache"
harness = false
