[package]
name = "attenuo-cli"
description = "The `attenuo` command line: mint, exchange and inspect delegation tokens, call tools through the proxy, and administer a running attenuo server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
keywords = ["mcp", "authorization", "delegation", "agents", "cli"]
categories = ["command-line-utilities", "authentication"]

[[bin]]
name = "attenuo"
path = "src/main.rs"

[dependencies]
attenuo-core = { workspace = true }
attenuo-token = { workspace = true }
attenuo-audit = { workspace = true }
attenuo-policy = { workspace = true }
anyhow = { workspace = true }
# The HTTP side of `stdio-bridge`; already in the workspace through the server and the proxy.
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["env"] }
hex = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }

# Signalling the STDIO server's process group (stdio-bridge) without `unsafe`. Already in the
# lock file through tokio's and tempfile's dependencies.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
tempfile = { workspace = true }
# `audit compact` tests change a file's schema version directly.
rusqlite = { workspace = true }
attenuo-core = { workspace = true }
attenuo-server = { path = "../attenuo-server" }
attenuo-proxy = { workspace = true, features = ["testing"] }
