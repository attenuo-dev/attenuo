[package]
name = "attenuo-proxy"
description = "Policy enforcement point for attenuo: an MCP reverse proxy that authorizes every tools/call"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true
keywords = ["mcp", "proxy", "authorization", "agents", "enforcement"]
categories = ["network-programming", "web-programming::http-server", "authentication"]

[features]
default = []
# Test doubles (FakeMcpServer, StaticAuthorizer) for downstream crates' tests.
testing = []
# Re-exports of crate-private SSE helpers for the cargo-fuzz targets in `fuzz/`. Not an API.
fuzzing = []

[dependencies]
attenuo-core = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Enables the `testing` module for this crate's own integration tests.
attenuo-proxy = { path = ".", features = ["testing"] }
# Paused time (`start_paused`) for the re-check ticks in `tests/session_and_stream_guard.rs`.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[[example]]
name = "fake_mcp"
required-features = ["testing"]
