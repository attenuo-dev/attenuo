[workspace]
resolver = "2"
members = [
    "crates/onbehalf-core",
    "crates/onbehalf-token",
    "crates/onbehalf-policy",
    "crates/onbehalf-audit",
    "crates/onbehalf-proxy",
    "crates/onbehalf-server",
    "crates/onbehalf-cli",
    "crates/onbehalf-bench",
]
# The cargo-fuzz targets build only on nightly (sanitizer flags) and keep their own lockfile;
# see docs/design/fuzzing.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/7Mudit/onbehalf"
rust-version = "1.89"

[workspace.dependencies]
onbehalf-core = { path = "crates/onbehalf-core" }
onbehalf-token = { path = "crates/onbehalf-token" }
onbehalf-policy = { path = "crates/onbehalf-policy" }
onbehalf-audit = { path = "crates/onbehalf-audit" }
onbehalf-proxy = { path = "crates/onbehalf-proxy" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ryu = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
jsonwebtoken = "9"
cedar-policy = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
glob-match = "0.2"
rand = "0.8"
ring = "0.17"
tempfile = "3"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde_urlencoded = "0.7"
serde_yaml = "0.9"
miette = { version = "7", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
