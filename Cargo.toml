[workspace]
resolver = "2"
members = [
    "crates/attenuo-core",
    "crates/attenuo-token",
    "crates/attenuo-policy",
    "crates/attenuo-audit",
    "crates/attenuo-proxy",
    "crates/attenuo-server",
    "crates/attenuo-cli",
    "crates/attenuo-bench",
]
# The cargo-fuzz targets build only on nightly (sanitizer flags) and keep their own lockfile;
# see docs/design/fuzzing.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/attenuo-dev/attenuo"
homepage = "https://github.com/attenuo-dev/attenuo"
rust-version = "1.89"

[workspace.dependencies]
attenuo-core = { version = "0.2.1", path = "crates/attenuo-core" }
attenuo-token = { version = "0.2.1", path = "crates/attenuo-token" }
attenuo-policy = { version = "0.2.1", path = "crates/attenuo-policy" }
attenuo-audit = { version = "0.2.1", path = "crates/attenuo-audit" }
attenuo-proxy = { version = "0.2.1", path = "crates/attenuo-proxy" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ryu = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
http-body = "1"
# The server's own accept loop (`[limits] header_read_timeout_seconds`); both already come in
# through axum.
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
jsonwebtoken = "9"
cedar-policy = "4"
rusqlite = { version = "0.42", features = ["bundled", "hooks"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# The attenuo CLI's `--tls-*` options: reading PEM sections and zeroing its buffers for the
# client key. Both are already in the lock file through reqwest's rustls.
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
glob-match = "0.2"
rand = "0.8"
ring = "0.17"
tempfile = "3"
# `statfs(2)` for the network-filesystem check (attenuo-audit); the version tempfile already uses.
rustix = { version = "1.1", features = ["fs"] }
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# rcgen is test-only (attenuo-server dev-dependencies): a CA and server certificates made in
# the tests. rustls and tokio-rustls serve `[server.tls]` in attenuo-server and the test TLS
# servers; they are the versions reqwest already brings in, with its `ring` provider.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Path building for RFC 8705 `tls_client_auth` in attenuo-server (`src/client_pki.rs`): the
# version rustls already brings in, with the same `ring` algorithms.
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
serde_urlencoded = "0.7"
form_urlencoded = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
miette = { version = "7", default-features = false }
unicode-normalization = "0.1"
url = "2.5"
# OpenTelemetry trace export (`[telemetry]`, docs/design/otel-export.md). OTLP over HTTP with
# protobuf only, sent through the workspace's reqwest 0.12 (no second HTTP client, no gRPC).
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto"] }
opentelemetry-http = { version = "0.33", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
