# attenuo-server example configuration.
#
#   cargo run -p attenuo-server -- --config config/example.toml
#   # or: ATTENUO_CONFIG=config/example.toml cargo run -p attenuo-server
#
# Relative paths are resolved against the working directory. Unknown keys are rejected.

[server]
listen = "127.0.0.1:8080"
# Externally visible base URL: the only source of the URLs in
# /.well-known/authzen-configuration. Required when `listen` is not a loopback address (the
# server refuses to start without it). On loopback it may stay unset: discovery then uses
# http://<Host>, and only a Host of localhost, 127.0.0.1 or [::1] is accepted (400 otherwise).
# public_url = "https://attenuo.example.com"

[issuer]
issuer = "http://127.0.0.1:8080"
audience = "attenuo"
max_depth = 8
default_ttl_seconds = 900
# How long a hop's lease lives after issuance or POST /token/renew (capped by the token's
# expiry). An agent that stops renewing is denied after this long; revocation is immediate.
lease_interval_seconds = 300
# Ed25519 PKCS#8 key. Generated (mode 0600) on first start if missing; the public key is
# logged and served at /.well-known/jwks.json. Omit to use an ephemeral key.
private_key_pem_path = "data/issuer.pem"
# Key rotation: keep retired keys (PEM, private or public) trusted for verification and in the
# JWKS until their tokens expire. They never sign. See docs/guides/deploying.md.
# previous_key_paths = ["data/issuer-old.pem"]

[policy]
# Cedar policies. POST /admin/policies/reload re-reads this file.
policies_path = "config/policies/default.cedar"
# Tool catalog: attributes policies can test (resource.readonly, resource.sensitive) and the
# argument types used to validate `context.input.*`. The types are also checked on every call,
# before Cedar: an argument of another type is denied (input_type_mismatch); undeclared
# arguments are not checked. Every action a policy names must be here:
# the entry [policy.catalog.github.read_file] declares Action::"github/read_file".
# Server and tool names are ASCII letters, digits, "_", "." and "-" only (a tool may also be an
# MCP method name such as "resources/read"); anything else is refused at start.
# Alternatively (or additionally) point catalog_path at a JSON file of the same shape:
# { "github": { "read_file": { "readonly": true, "inputs": { "repo": "string" } } } }
# catalog_path = "config/catalog.json"
# A Cedar schema file replacing the built-in entity types (it must keep them, their attributes
# and hierarchy; it may add entity types and optional attributes). Actions are still generated.
# schema_path = "config/base.cedarschema"
# Calls to a (server, tool) pair missing from the catalog: "deny" (default, reason
# tool_not_in_catalog), "sensitive" (evaluated with resource.sensitive = true) or "allow"
# (default attributes; forbids keyed on resource.sensitive do not apply).
unknown_tools = "deny"
# DEPRECATED. Policies name actions per server, Action::"<server>/<tool>". `true` brings back
# the old bare Action::"<tool>", which matches that tool on every server; only for a policy set
# not yet rewritten (`attenuo policy lint` lists the bare actions). Logged as a warning.
legacy_bare_actions = false

# Extra originating_user.attributes the Cedar schema should know, so policies that test them
# validate. Types: string, long, bool, set<string> (any scalar inside set<>). The built-in four
# (mfa: bool, roles: set<string>, tenant: string, email: string) are always declared.
# The values come from the IdP token claims listed in [[idps]] attribute_claims.
user_attributes = { groups = "set<string>", department = "string" }

[policy.catalog.github.read_file]
readonly = true
inputs = { repo = "string", path = "string" }

[policy.catalog.github.create_issue]
inputs = { repo = "string", title = "string" }

[policy.catalog.github.delete_repo]
sensitive = true
inputs = { repo = "string" }

[audit]
# Audit log and lease registry. ":memory:" keeps both in memory (lost on exit).
sqlite_path = "data/attenuo.sqlite"
# Signed checkpoints: the issuer key signs the head of the hash chain, so truncation or a
# rewritten history can be caught with only the JWKS (`attenuo audit verify`). One is written
# every `checkpoint_every` entries and at least every `checkpoint_interval_seconds` while
# entries arrive; 0 turns a trigger off.
checkpoint_every = 1000
checkpoint_interval_seconds = 300
# A file-backed store runs SQLite in WAL mode. "normal" (default) does not fsync on commit:
# a process crash loses nothing, a power failure or OS crash can lose the newest decisions
# (never tear one; the chain still verifies, ending earlier). "full" fsyncs every commit and
# costs throughput. Lease revocations always fsync. Ignored for ":memory:".
durability = "normal"
# A background thread checkpoints SQLite's write-ahead log into the database file this often
# (and after every 256 commits), so appends do not wait while it copies; at "normal" that is
# also when the newest decisions reach the disk. 0 leaves it to SQLite on the writer.
wal_checkpoint_seconds = 5

# Ship every signed checkpoint off the host as it is created (SR-21). The signing key lives
# here, so only a copy that already left the host shows a log rewritten and re-signed later
# (`attenuo audit verify --file <export> --checkpoints <shipped.jsonl>`). kind = "webhook"
# (POST, any 2xx), "file" (append JSON Lines on another mount, shipped by your own agent) or
# "s3" (SigV4 PUT to an S3-compatible bucket). Delivery is queued and retried with backoff;
# /readyz reports "degraded" when the queue is full or lags more than max_lag_seconds.
# [audit.sink]
# kind = "webhook"
# url = "https://anchor.example.com/attenuo/checkpoints"
# bearer_token = "..."          # or ATTENUO_AUDIT_SINK_TOKEN
# max_lag_seconds = 300
# queue_capacity = 1024

# MCP servers (Streamable HTTP), mounted at /mcp/<name>. `name` is the server part of
# capabilities, e.g. "github:read_file".
[[upstreams]]
name = "github"
url = "http://127.0.0.1:3001/mcp"

[admin]
# Static bearer for /admin/*. v0 only; do not expose /admin publicly. No token ships here:
# generate one with `openssl rand -hex 32` and put it here, or set ATTENUO_ADMIN_TOKEN (which
# overrides this value). Without a token the admin routes answer 403. Off a loopback `listen`
# address the server refuses to start when the token is missing, shorter than 32 bytes or a
# published placeholder.
# token = "<output of openssl rand -hex 32>"

# Trusted identity providers for hop 0. POST /token accepts an OIDC ID token
# (subject_token_type = urn:ietf:params:oauth:token-type:id_token) or an ID-JAG
# (urn:ietf:params:oauth:token-type:id-jag) from these issuers only. Any OIDC-compliant IdP
# works (Okta, Entra ID, Google, Auth0, Keycloak, Dex, ...).
[[idps]]
issuer = "https://idp.example"
# Per-agent client id at the IdP (SR-37). An ID token is accepted only from the agent whose
# client id its `aud` names (and, when `aud` lists several values, its `azp`). An agent without
# an entry here must have a client id equal to its agent id; the server warns for each one.
# (An ID-JAG's `aud` must be [issuer] issuer instead.) The old `audience` key is ignored.
client_ids = { planner = "planner-app", coder = "coder-app" }
# Optional; when absent, jwks_uri from <issuer>/.well-known/openid-configuration.
# jwks_url = "https://idp.example/oauth2/v1/keys"
allowed_algs = ["RS256", "ES256", "EdDSA"]
# Claims copied into originating_user.attributes. `mfa` (bool) is always derived from `amr`.
attribute_claims = ["email", "groups", "amr"]
# jwks_ttl_seconds = 300
# clock_skew_seconds = 60

# Agents (OAuth clients) that may present user credentials at POST /token, authenticated with
# client_id/client_secret (form or HTTP Basic). secret_sha256 = `printf %s "$SECRET" | sha256sum`.
# With no [[agents]], every IdP intake request is rejected.
[[agents]]
id = "planner"
secret_sha256 = "a93d472e76b73bffcef69973eb463fb679b1365377e183a459d7f33c2ee97b7a"   # "planner-secret-change-me"

# Agents also authenticate on every token exchange (hop n to n+1) as the `actor` they name.
[[agents]]
id = "coder"
secret_sha256 = "c0a83cbb212848e0615711bb006be7edb88db29def8c4dae01c7465c6f64e99e"   # "coder-secret-change-me"

[token]
# Require the caller of an exchange to authenticate as its `actor`. Setting this to false makes
# `actor` an unverified assertion again; the server warns at startup.
require_actor_auth = true
# Which credentials authenticate the actor of an exchange and the agent at hop 0 (IdP intake):
# "secret" ([[agents]] credentials, HTTP Basic or client_id/client_secret), "actor_token" (an
# RFC 8693 actor_token from an [[actor_trust]] issuer, e.g. a SPIFFE JWT-SVID) or "either".
# When both are sent, both are checked.
actor_auth = "either"
# Sender-constrained tokens (DPoP, RFC 9449). "optional": a request for a token that carries a
# DPoP proof gets a token bound to the proof's key (cnf.jkt), usable only with proofs by that
# key. "off": never bind new tokens. "required": every token must be bound; unbound ones are
# refused. Bound tokens always need proofs, whatever this says.
dpop = "optional"
# How far a proof's iat may be from the server's clock (seconds, 1 to 3600).
dpop_max_age_seconds = 300
# Most proof jtis remembered for replay detection; when full, new proofs get 503.
dpop_replay_capacity = 1000000
# Server-provided DPoP nonces (RFC 9449 section 8). "required": every proof must carry the
# nonce from the server's latest DPoP-Nonce response header, or the request gets 401
# use_dpop_nonce with the nonce to retry with. "off" (default): no nonces.
dpop_nonce = "off"

[approvals]
# A call gated by an @obligation("approval") forbid gets JSON-RPC -32008 with an approval_id.
# The originating user grants it at POST /approvals/{id} with an ID token from their IdP, or
# an operator at POST /admin/approvals/{id}; the agent then retries the identical call once.
# Seconds a pending or granted approval stays usable (also capped by the calling hop's lease).
ttl_seconds = 120
# The `aud` an approval ID token must carry. Default: the client id hop-0 intake expects for
# the run's root agent. Prefer a client the agent does not control, such as your approval page.
# client_id = "attenuo-approvals"
# With an approval policy loaded and client_id unset, the server warns, and refuses to start
# when [server] listen is not loopback (SR-64). Set this only where the agent cannot obtain
# ID tokens for the user by itself.
# allow_unset_client_id = false

[leases]
# Seconds a chain's leases (with their recorded users and bindings) are kept once every lease
# in the chain is revoked or expired. Keep it above the longest token lifetime you issue: an
# expired lease can be renewed while its token is valid. A pruned chain is no longer found by
# revoke-by-user or shown in the console; the audit log keeps every decision. 0 keeps every
# lease.
retention_seconds = 604800
# Seconds a session binding (revoke by session) is kept after its chain's root lease expired;
# a revoked chain's bindings go at the next pass (every minute). Keep it above the longest
# token lifetime you issue: an expired lease can be renewed while its token is valid. 0 keeps
# every binding.
session_retention_seconds = 86400

# Workload identities accepted as `actor_token` on an exchange or at hop 0. Each actor token
# works for one request, and the token it obtains never outlives it. A SPIFFE trust domain, keys from the SPIRE
# server's bundle endpoint (given explicitly, never discovered):
# [[actor_trust]]
# spiffe_trust_domain = "example.org"
# spiffe_bundle_url = "https://spire-server.example.org:8443"
# audience = "http://127.0.0.1:8080"          # what the agent asks SPIRE to put in `aud`
# subject_to_agent = { "spiffe://example.org/ns/agents/sa/coder" = "coder" }   # or "sub", "spiffe_path"
#
# Any other JWT issuer with a JWKS:
# [[actor_trust]]
# issuer = "https://workload-issuer.example"
# jwks_url = "https://workload-issuer.example/jwks"
# audience = "http://127.0.0.1:8080"
# subject_to_agent = "sub"

# The most a root token may carry: for users of `issuer`, held by `agent`. Add `subject = "..."`
# to pin an entry to one user (a pinned entry wins over an unpinned one). The capabilities
# requested at /token are attenuated against the matching entry; no entry, no root token.
[[root_grants]]
issuer = "https://idp.example"
agent = "planner"
capabilities = ["github:*"]
# Only the dev root mint copies `attributes`; IdP intake takes attributes from the verified token.
attributes = { mfa = false }
# Optional RFC 8693 may_act: only these agents may exchange root tokens minted under this grant.
# may_act = ["coder"]

[authzen]
# POST /access/v1/evaluation requires `Authorization: Bearer <attenuo token>` by default.
# Set to true to also accept a chain in subject.properties.chain without the token, from a
# PEP listed in [[peps]] (HTTP Basic, or pep_id/pep_secret in the body). Each hop of such a
# chain must match what this server issued for its lease, or the request gets 403.
allow_unsigned_chain = false
# Most evaluations one POST /access/v1/evaluations may carry. Larger requests get 400
# batch_too_large before anything is decided or audited.
max_batch = 64
# Who gets context.diagnostics (effective capabilities, lease ids, Cedar errors) in
# evaluation responses: "peps" (callers authenticated as a [[peps]] entry; with a bearer
# token, by pep_id/pep_secret in the body), "always" or "never". Others get an empty list.
diagnostics = "peps"

# Policy enforcement points for allow_unsigned_chain, same shape as [[agents]].
# [[peps]]
# id = "gateway"
# secret_sha256 = "<printf %s \"$SECRET\" | sha256sum>"

[dev]
# DEVELOPMENT ONLY. Mounts POST /admin/root-token, which mints root tokens for a user nobody
# verified (admin bearer + [[root_grants]] only). The server logs a warning when this is on.
allow_root_mint = false

[proxy]
# How often (seconds, at least 1) a long-lived response stream (the GET listen stream, or a
# tools/call answered over SSE) is re-checked against lease state and token expiry. The stream
# is ended at the first failed check, so a revoked or expired token loses it within this time.
stream_recheck_seconds = 2
# Refuse a tools/call whose exact name the upstream never returned from tools/list and the
# catalog does not know (reason tool_not_listed), so an upstream that resolves names
# case-insensitively cannot run delete_repo for "Delete_Repo".
require_listed_tools = true
# Memory bounds. An upstream body the proxy must buffer (a JSON list result it filters, one SSE
# event) over max_upstream_body_bytes gets 502; a request body over max_request_body_bytes
# gets 413.
max_upstream_body_bytes = 16777216
max_request_body_bytes = 4194304
# Mcp-Session-Id bindings: idle lifetime, and how many are held. When every slot is live a new
# session gets 503 session_registry_full; live sessions are never evicted to make room.
session_ttl_seconds = 3600
max_sessions = 100000
# Live sessions one principal (one root grant and the agents it delegates to) may hold; one more
# gets 429 too_many_sessions, and other users are unaffected. A session the proxy refuses is
# deleted at the upstream.
max_sessions_per_principal = 64

[metrics]
# Prometheus text endpoint on its OWN listener (GET /metrics), never on the proxy port.
# No authentication: keep it on loopback or a private network.
enabled = false
# listen = "127.0.0.1:9100"
# A non-loopback `listen` is refused at startup unless this is true (SR-38).
# allow_public = false

[admin_ui]
# The admin console on its OWN listener (/admin/ui/ plus the admin API, same admin token).
# Read-only unless allow_write; never serves /admin/root-token; no CORS.
enabled = false
# listen = "127.0.0.1:9101"
# A non-loopback `listen` is refused at startup unless this is true.
# allow_public = false
# Mount POST /admin/leases/{id}/revoke and POST /admin/policies/reload on this listener.
# allow_write = false
