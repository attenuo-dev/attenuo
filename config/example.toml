# attenuo-server example configuration.
#
#   cargo run -p attenuo-server -- --config config/example.toml
#   # or: ATTENUO_CONFIG=config/example.toml cargo run -p attenuo-server
#
# Relative paths are resolved against the working directory. Unknown keys are rejected.
#
# Any scalar key can be overridden from the environment with ATTENUO__<SECTION>__<KEY>, two
# underscores each (ATTENUO__SERVER__LISTEN=0.0.0.0:8080, ATTENUO__ADMIN__LISTEN=0.0.0.0:9102,
# ATTENUO__TELEMETRY__TRACES__SAMPLE_RATIO=0.1). The overrides are applied before the startup
# checks, and a variable that names no key, has a value of the wrong type or names a [dev] key
# stops the server. Lists and [[...]] entries come from this file only. See
# docs/reference/config.md, "Environment overrides".

[server]
listen = "127.0.0.1:8080"
# Externally visible base URL: the only source of the URLs in
# /.well-known/authzen-configuration. Required when `listen` is not a loopback address (the
# server refuses to start without it). On loopback it may stay unset: discovery then uses
# http://<Host>, and only a Host of localhost, 127.0.0.1 or [::1] is accepted (400 otherwise).
# Terminate TLS at a reverse proxy and give its https:// URL here, or turn on [server.tls]
# below. A plain http:// public_url on a host that is not loopback is refused (tokens would
# cross the network in cleartext) unless allow_insecure_http = true.
# public_url = "https://attenuo.example.com"
# allow_insecure_http = false

# TLS on this listener ([server] listen) only, off by default. The admin, console and metrics
# listeners stay plain HTTP. TLS 1.3 only, HTTP/1.1 only. The files
# are read at start: a renewed certificate needs a restart. With it, public_url must be set
# and https://, and allow_insecure_http is refused. See docs/guides/deploying.md.
# [server.tls]
# # The server certificate first, then any intermediate certificates.
# cert_pem_path = "/etc/attenuo/tls/server.crt"
# # One private key (PKCS#8, SEC1 or PKCS#1, not encrypted). On Unix: owned by the server's
# # user or root, no access for others, no group write, and group read only when root owns
# # the file (0600 for the server's own file, 0640 when root owns it), as PostgreSQL asks of
# # ssl_key_file.
# key_pem_path = "/etc/attenuo/tls/server.key"
# # "off" (default): ask for no client certificate. "optional": ask for one, never require
# # one, so agents and PEPs with tls_client_cert_sha256 (a self-signed certificate) or
# # tls_client_ca_pem_path (a certificate from a CA) can authenticate with it (RFC 8705).
# # A proxy that ends TLS in front hides it: needs a direct connection or TCP pass-through.
# # There is no "required".
# client_certificates = "off"

[issuer]
issuer = "http://127.0.0.1:8080"
audience = "attenuo"
max_depth = 8
default_ttl_seconds = 900
# How long a hop's lease lives after issuance or POST /token/renew (capped by the token's
# expiry). An agent that stops renewing is denied after this long; revocation is immediate.
lease_interval_seconds = 300
# Ed25519 PKCS#8 key. Generated (mode 0600) on first start if missing; the public key is
# logged and served at /.well-known/jwks.json. Omit to use an ephemeral key.
private_key_pem_path = "data/issuer.pem"
# Key rotation: keep retired keys (PEM, private or public) trusted for verification and in the
# JWKS until their tokens expire. They never sign. POST /admin/keys/reload (attenuo admin key
# reload) re-reads these two keys and their files without a restart. See docs/guides/deploying.md.
# previous_key_paths = ["data/issuer-old.pem"]

[policy]
# Cedar policies. POST /admin/policies/reload re-reads this file.
policies_path = "config/policies/default.cedar"
# Tool catalog: attributes policies can test (resource.readonly, resource.sensitive) and the
# argument types used to validate `context.input.*`. The types are also checked on every call,
# before Cedar: an argument of another type is denied (input_type_mismatch); undeclared
# arguments are not checked. Every action a policy names must be here:
# the entry [policy.catalog.github.read_file] declares Action::"github/read_file".
# Server and tool names are ASCII letters, digits, "_", "." and "-" only (a tool may also be an
# MCP method name such as "resources/read"); anything else is refused at start.
# Alternatively (or additionally) point catalog_path at a JSON file of the same shape:
# { "github": { "read_file": { "readonly": true, "inputs": { "repo": "string" } } } }
# catalog_path = "config/catalog.json"
# A Cedar schema file replacing the built-in entity types (it must keep them, their attributes
# and hierarchy; it may add entity types and optional attributes). Actions are still generated.
# schema_path = "config/base.cedarschema"
# Calls to a (server, tool) pair missing from the catalog: "deny" (default, reason
# tool_not_in_catalog), "sensitive" (evaluated with resource.sensitive = true) or "allow"
# (default attributes; forbids keyed on resource.sensitive do not apply).
unknown_tools = "deny"
# DEPRECATED. Policies name actions per server, Action::"<server>/<tool>". `true` brings back
# the old bare Action::"<tool>", which matches that tool on every server; only for a policy set
# not yet rewritten (`attenuo policy lint` lists the bare actions). Logged as a warning.
legacy_bare_actions = false

# Extra originating_user.attributes the Cedar schema should know, so policies that test them
# validate. Types: string, long, bool, set<string> (any scalar inside set<>). The built-in four
# (mfa: bool, roles: set<string>, tenant: string, email: string) are always declared.
# The values come from the IdP token claims listed in [[idps]] attribute_claims.
user_attributes = { groups = "set<string>", department = "string" }

[policy.catalog.github.read_file]
readonly = true
inputs = { repo = "string", path = "string" }

[policy.catalog.github.create_issue]
inputs = { repo = "string", title = "string" }

[policy.catalog.github.delete_repo]
sensitive = true
inputs = { repo = "string" }

# A fetch is read-only, but its `url` goes to whatever host the URL names, which can be the
# attacker's: an outbound argument. `outbound = "url#host"` makes the fetch keep run usage per
# host (context.usage.destination_seen, as `destination` does for a destructive tool) and sets
# context.untrusted_outbound when the URL carries text from an untrusted result of the run.
# Cedar sees resource.outbound = true. A list names several: outbound = ["url", "callback"].
[policy.catalog.web.fetch]
readonly = true
inputs = { url = "string" }
outbound = "url#host"

[audit]
# Audit log and lease registry. ":memory:" keeps both in memory (lost on exit).
sqlite_path = "data/attenuo.sqlite"
# Signed checkpoints: the issuer key signs the head of the hash chain, so truncation or a
# rewritten history can be caught with only the JWKS (`attenuo audit verify`). One is written
# every `checkpoint_every` entries and at least every `checkpoint_interval_seconds` while
# entries arrive; 0 turns a trigger off.
checkpoint_every = 1000
checkpoint_interval_seconds = 300
# A file-backed store runs SQLite in WAL mode. "normal" (default) does not fsync on commit:
# a process crash loses nothing, a power failure or OS crash can lose the newest decisions
# (never tear one; the chain still verifies, ending earlier). "full" fsyncs every commit and
# costs throughput. Lease revocations always fsync. Ignored for ":memory:".
durability = "normal"
# A background thread checkpoints SQLite's write-ahead log into the database file this often
# (and after every 256 commits), so appends do not wait while it copies; at "normal" that is
# also when the newest decisions reach the disk. 0 leaves it to SQLite on the writer.
wal_checkpoint_seconds = 5
# Appends waiting for the audit writer: at most append_queue_max at once (16 to 1000000), each
# for at most append_timeout_seconds (1 to 300). Past either the decision is denied with
# audit_error and counted in audit_append_shed_total, so a hung disk denies calls instead of
# piling up blocked threads.
append_queue_max = 1024
append_timeout_seconds = 10
# The server refuses to start when sqlite_path's directory is on a network filesystem (NFS,
# SMB/CIFS, 9p, CephFS, Lustre, AFS): SQLite's WAL mode and the single-writer lock are not
# reliable there. true starts it anyway, with a warning; only if one host ever mounts it.
allow_network_filesystem = false

# Ship every signed checkpoint off the host as it is created (SR-21). The signing key lives
# here, so only a copy that already left the host shows a log rewritten and re-signed later
# (`attenuo audit verify --file <export> --checkpoints <shipped.jsonl>`). kind = "webhook"
# (POST, any 2xx), "file" (append JSON Lines on another mount, shipped by your own agent) or
# "s3" (SigV4 PUT to an S3-compatible bucket). Delivery is queued and retried with backoff;
# /readyz reports "degraded" when the queue is full or lags more than max_lag_seconds.
# [audit.sink]
# kind = "webhook"
# url = "https://anchor.example.com/attenuo/checkpoints"
# bearer_token = "..."          # or ATTENUO_AUDIT_SINK_TOKEN
# max_lag_seconds = 300
# queue_capacity = 1024

# Pruning the oldest audit entries behind a signed anchor (ADR-0015). "off" (the default)
# never prunes. "manual" lets the admin prune through GET /admin/audit/prune/plan and
# POST /admin/audit/prune, after exporting and keeping the archive; it needs [audit.sink] and a
# file sqlite_path. "auto" also prunes on a timer, with keep_seconds and the other keys of
# [audit.retention] in docs/reference/config.md. Nothing younger than min_age_seconds is
# pruned, and it may not be below [leases] retention_seconds + run_state_retention_seconds, nor
# below [leases] user_window_retention_seconds (at most 100 years). The rows are deleted
# afterwards, batch_rows per transaction (1 to 1000000), by the maintenance task.
[audit.retention]
prune = "off"
min_age_seconds = 7776000
batch_rows = 10000

# MCP servers (Streamable HTTP), mounted at /mcp/<name>. `name` is the server part of
# capabilities, e.g. "github:read_file".
[[upstreams]]
name = "github"
url = "http://127.0.0.1:3001/mcp"

# An external gateway (agentgateway's HTTP extAuthz) may ask for the proxy's decision about a
# request it is about to forward, at /ext-authz/v1/mcp/<server>. Off unless an entry is set.
# The gateway sends the secret in X-Attenuo-Gateway-Secret; dpop_url is the URL agents call
# on the gateway, for DPoP-bound tokens. See docs/guides/agentgateway.md.
# [[ext_authz]]
# server = "github"
# secret_sha256 = "<printf %s \"$SECRET\" | sha256sum>"
# dpop_url = "https://gateway.example/mcp"

[admin]
# Static bearer for /admin/*, the operator `admin` with role admin (recorded as
# urn:attenuo:admin). Do not expose /admin publicly. No token ships here: generate one with
# `openssl rand -hex 32` and put it here, or set ATTENUO_ADMIN_TOKEN (which overrides this
# value). Without a token or [[admin.operators]] the admin routes answer 403. Off a loopback
# `listen` address the server refuses to start with no admin credential at all, or with a token
# shorter than 32 bytes or a published placeholder.
# token = "<output of openssl rand -hex 32>"
# Serve /admin/* on a listener of its own, and not on [server] listen (which then answers
# those paths as unknown ones, 404). /healthz and /readyz stay on the main listener. Point the
# CLI's --server (ATTENUO_SERVER) at this address for admin commands. When [server] listen is
# not a loopback address the server refuses to start unless this is set, or
# serve_on_main_listener = true below.
# listen = "127.0.0.1:9102"
# Keep /admin/* on [server] listen although it is not loopback: only when something in front
# of the server keeps /admin/ away from agents. Logs a warning. Not with `listen`.
# serve_on_main_listener = false

# Named operators, each with its own token and a role (ADR-0016): viewer (reads), operator
# (also revoke leases and decide approvals) or admin (everything). Only the SHA-256 of the
# token is kept here. `attenuo admin operator new --name alice --role operator` prints a new
# token once and this entry. Read at startup, and again by `attenuo admin operator reload`
# (POST /admin/operators/reload), which puts a changed list in force without a restart: to
# withdraw a leaked token, remove its entry and reload. Optional `expires_at` (RFC 3339 with
# an offset; `--expires-in 90d` writes it): after it the token is refused.
# [[admin.operators]]
# name = "alice"
# token_sha256 = "<64 lowercase hex characters>"
# role = "operator"
# expires_at = "2026-12-31T23:59:59Z"

# Trusted identity providers for hop 0. POST /token accepts an OIDC ID token
# (subject_token_type = urn:ietf:params:oauth:token-type:id_token) or an ID-JAG
# (urn:ietf:params:oauth:token-type:id-jag) from these issuers only. Any OIDC-compliant IdP
# works (Okta, Entra ID, Google, Auth0, Keycloak, Dex, ...).
[[idps]]
issuer = "https://idp.example"
# Per-agent client id at the IdP (SR-37). An ID token is accepted only from the agent whose
# client id its `aud` names (and, when `aud` lists several values, its `azp`). An agent without
# an entry here must have a client id equal to its agent id; the server warns for each one.
# (An ID-JAG's `aud` must be [issuer] issuer instead.) The old `audience` key is ignored.
client_ids = { planner = "planner-app", coder = "coder-app" }
# Optional; when absent, jwks_uri from <issuer>/.well-known/openid-configuration.
# Key fetches are https:// only (plain http:// only for a loopback host, for local testing)
# and never follow redirects: give the final URL.
# jwks_url = "https://idp.example/oauth2/v1/keys"
allowed_algs = ["RS256", "ES256", "EdDSA"]
# Claims copied into originating_user.attributes. `mfa` (bool) is always derived from `amr`.
attribute_claims = ["email", "groups", "amr"]
# jwks_ttl_seconds = 300
# clock_skew_seconds = 60
# Multi-tenant issuer: an ID-JAG must carry this `tenant` claim (ID tokens are not affected).
# tenant = "acme"

# Agents (OAuth clients) that may present user credentials at POST /token, authenticated with
# client_id/client_secret (form or HTTP Basic). secret_sha256 = `printf %s "$SECRET" | sha256sum`.
# With no [[agents]], every request that authenticates with client credentials is rejected
# (an agent with an actor_token from [[actor_trust]] needs no entry). Read at startup, and
# again with [[peps]] by `attenuo admin agent reload` (POST /admin/agents/reload), which puts
# changed lists in force without a restart; tokens already issued are not revoked by it.
[[agents]]
id = "planner"
secret_sha256 = "a93d472e76b73bffcef69973eb463fb679b1365377e183a459d7f33c2ee97b7a"   # "planner-secret-change-me"
# Instead of (or next to) secret_sha256, an entry can hold public keys; the agent then signs a
# client assertion (private_key_jwt, RFC 7523) with aud = [issuer] issuer and a fresh jti.
# `attenuo key gen --client planner.jwk` writes the private key and prints this line.
# Up to 8 keys (RSA >= 2048 / RS256, P-256 / ES256, Ed25519 / EdDSA); give each a kid to rotate.
# jwks = '''{"keys":[{"kty":"OKP","crv":"Ed25519","x":"<public key>","kid":"planner-1","alg":"EdDSA","use":"sig"}]}'''
# Or the keys at a URL the agent publishes them at, so it can rotate them with no change here
# (not with jwks). Fetched on first use, https:// only, no redirects, kept for
# jwks_ttl_seconds and fetched again on an unknown kid. Optional ca_pem_path for a private CA.
# jwks_url = "https://planner.example.com/.well-known/jwks.json"
# jwks_ttl_seconds = 300
# Or self-signed TLS client certificates (RFC 8705 self_signed_tls_client_auth): 1 to 8
# SHA-256 thumbprints, lowercase hex. Needs [server.tls] client_certificates = "optional".
# The agent sends the certificate in the handshake and client_id with no secret. The
# certificate must be within its dates, not a CA certificate, and allow clientAuth.
# Thumbprint: openssl x509 -in planner.crt -outform DER | sha256sum | cut -d' ' -f1
# tls_client_cert_sha256 = ["<64 lowercase hex characters>"]
# Or TLS client certificates from a CA (RFC 8705 tls_client_auth): the CA file and exactly
# one name the certificate must carry, a URI (a SPIFFE ID: then its only URI name) or a DNS
# name (no wildcard). Not with tls_client_cert_sha256. No CRL or OCSP check. The agent may
# send at most 4 intermediate CA certificates after its own.
# tls_client_ca_pem_path = "/etc/attenuo/agents-ca.pem"
# tls_client_auth_san_uri = "spiffe://example.org/ns/agents/sa/planner"
# # or, instead of the URI:
# # tls_client_auth_san_dns = "planner.agents.internal"

# Agents also authenticate on every token exchange (hop n to n+1) as the `actor` they name.
[[agents]]
id = "coder"
secret_sha256 = "c0a83cbb212848e0615711bb006be7edb88db29def8c4dae01c7465c6f64e99e"   # "coder-secret-change-me"

[token]
# Require the caller of an exchange to authenticate as its `actor`. Setting this to false makes
# `actor` an unverified assertion again; the server warns at startup.
require_actor_auth = true
# Which credentials authenticate the actor of an exchange and the agent at hop 0 (IdP intake):
# "secret" ([[agents]] credentials, HTTP Basic or client_id/client_secret), "actor_token" (an
# RFC 8693 actor_token from an [[actor_trust]] issuer, e.g. a SPIFFE JWT-SVID) or "either".
# When both are sent, both are checked.
actor_auth = "either"
# Sender-constrained tokens (DPoP, RFC 9449). "optional": a request for a token that carries a
# DPoP proof gets a token bound to the proof's key (cnf.jkt), usable only with proofs by that
# key. "off": never bind new tokens. "required": every token must be bound; unbound ones are
# refused. Bound tokens always need proofs, whatever this says.
dpop = "optional"
# How far a proof's iat may be behind the server's clock (seconds, 1 to 3600).
dpop_max_age_seconds = 300
# How far a proof's iat may be ahead of the server's clock (seconds, 0 to dpop_max_age_seconds;
# unset: 10, or dpop_max_age_seconds when that is smaller). A client whose clock runs further
# ahead is refused. After a quick restart, proofs made then are refused for up to this long
# plus about 11 seconds.
dpop_future_skew_seconds = 10
# Most proof jtis remembered for replay detection; when full, new proofs get 503.
dpop_replay_capacity = 1000000
# Server-provided DPoP nonces (RFC 9449 section 8). "required": every proof must carry the
# nonce from the server's latest DPoP-Nonce response header, or the request gets 401
# use_dpop_nonce with the nonce to retry with. "off" (default): no nonces.
dpop_nonce = "off"

[approvals]
# A call gated by an @obligation("approval") forbid gets JSON-RPC -32008 with an approval_id.
# The originating user grants it at POST /approvals/{id} with an ID token from their IdP, or
# an operator at POST /admin/approvals/{id}; the agent then retries the identical call once.
# Seconds a pending or granted approval stays usable (also capped by the calling hop's lease).
ttl_seconds = 120
# The `aud` an approval ID token must carry. Default: the client id hop-0 intake expects for
# the run's root agent. Prefer a client the agent does not control, such as your approval page.
# client_id = "attenuo-approvals"
# With an approval policy loaded and client_id unset, the server warns, and refuses to start
# when [server] listen is not loopback (SR-64). Set this only where the agent cannot obtain
# ID tokens for the user by itself.
# allow_unset_client_id = false

# POST a signed JSON notice to a webhook you own when an approval becomes pending, and again
# when it is decided or expires. Best effort: it never holds up a call or a decision, and a
# notice that fails max_attempts times is dropped and counted. The body is signed with
# HMAC-SHA-256 under the secret in the variable secret_env (at least 32 bytes, required):
# X-Attenuo-Signature: t=<unix seconds>,v1=<hex HMAC of "<t>.<body>">. Header values come
# from environment variables, never from this file.
# [approvals.notify]
# url = "https://hooks.example.com/attenuo/approvals"
# secret_env = "ATTENUO_APPROVAL_NOTIFY_SECRET"
# headers = { authorization = "ATTENUO_APPROVAL_NOTIFY_AUTH" }
# timeout_seconds = 5
# queue_capacity = 256
# max_attempts = 5

[leases]
# Seconds a chain's leases (with their recorded users and bindings) are kept once every lease
# in the chain is revoked or expired. Keep it above the longest token lifetime you issue: an
# expired lease can be renewed while its token is valid. A pruned chain is no longer found by
# revoke-by-user or shown in the console; the audit log keeps every decision unless pruned
# ([audit.retention]). 0 keeps every lease.
retention_seconds = 604800
# Seconds a session binding (revoke by session) is kept after its chain's root lease expired;
# a revoked chain's bindings go at the next pass (every minute by default). Keep it above the longest
# token lifetime you issue: an expired lease can be renewed while its token is valid. 0 keeps
# every binding.
session_retention_seconds = 86400
# Seconds a run's run-limit counters, charge log and approvals are kept once the run's leases
# are gone from the registry (after retention_seconds); nothing of a run still in the registry
# is deleted. After it, an operator refund of the run's decisions answers 410 charge_pruned; the audit log
# keeps every record unless pruned ([audit.retention]). 0 keeps everything.
run_state_retention_seconds = 2592000
# The task that prunes the three above runs every maintenance_interval_seconds (at least 1), in
# passes of maintenance_batch_rows rows (1 to 100000), one write transaction each, and at most
# maintenance_max_passes passes of each kind per run (1 to 10000); the rest waits for the next run.
maintenance_interval_seconds = 60
maintenance_batch_rows = 1000
maintenance_max_passes = 100

# POST a signed JSON notice (lease.revoked) to a webhook you own after each revocation request
# that revoked at least one lease, so an enforcement point outside the server (a gateway on
# /access/v1/evaluation, an ext-authz adapter) can refuse tokens whose chain holds a lease it
# names, and ask again about the chains it names. It is a hint, not enforcement: a PEP still
# learns of a revocation when it asks, and a lease that expires sends nothing. Same keys, signature and delivery as
# [approvals.notify]; use a secret of its own (at least 32 bytes, required).
# [leases.notify]
# url = "https://hooks.example.com/attenuo/revocations"
# secret_env = "ATTENUO_LEASE_NOTIFY_SECRET"
# headers = { authorization = "ATTENUO_LEASE_NOTIFY_AUTH" }
# timeout_seconds = 5
# queue_capacity = 256
# max_attempts = 5

# Workload identities accepted as `actor_token` on an exchange or at hop 0. Each actor token
# works for one request, and the token it obtains never outlives it. A SPIFFE trust domain, keys from the SPIRE
# server's bundle endpoint (given explicitly, never discovered). Key URLs are https:// only
# (plain http:// only for a loopback host) and redirects are not followed:
# [[actor_trust]]
# spiffe_trust_domain = "example.org"
# spiffe_bundle_url = "https://spire-server.example.org:8443"
# audience = "http://127.0.0.1:8080"          # what the agent asks SPIRE to put in `aud`
# subject_to_agent = { "spiffe://example.org/ns/agents/sa/coder" = "coder" }   # or "sub", "spiffe_path"
#
# Any other JWT issuer with a JWKS:
# [[actor_trust]]
# issuer = "https://workload-issuer.example"
# jwks_url = "https://workload-issuer.example/jwks"
# audience = "http://127.0.0.1:8080"
# subject_to_agent = "sub"

# The most a root token may carry: for users of `issuer`, held by `agent`. Add `subject = "..."`
# to pin an entry to one user (a pinned entry wins over an unpinned one). The capabilities
# requested at /token are attenuated against the matching entry; no entry, no root token.
[[root_grants]]
issuer = "https://idp.example"
agent = "planner"
capabilities = ["github:*"]
# Only the dev root mint copies `attributes`; IdP intake takes attributes from the verified token.
attributes = { mfa = false }
# Optional RFC 8693 may_act: only these agents may exchange root tokens minted under this grant.
# may_act = ["coder"]

[authzen]
# POST /access/v1/evaluation requires `Authorization: Bearer <attenuo token>` by default.
# Set to true to also accept a chain in subject.properties.chain without the token, from a
# PEP listed in [[peps]] (HTTP Basic, or pep_id/pep_secret in the body). Each hop of such a
# chain must match what this server issued for its lease, or the request gets 403.
allow_unsigned_chain = false
# Most evaluations one POST /access/v1/evaluations may carry. Larger requests get 400
# batch_too_large before anything is decided or audited.
max_batch = 64
# Who gets context.diagnostics (effective capabilities, lease ids, Cedar errors) in
# evaluation responses: "peps" (callers authenticated as a [[peps]] entry; with a bearer
# token, by pep_id/pep_secret in the body), "always" or "never". Others get an empty list.
diagnostics = "peps"

# Policy enforcement points for allow_unsigned_chain, same shape as [[agents]].
# [[peps]]
# id = "gateway"
# secret_sha256 = "<printf %s \"$SECRET\" | sha256sum>"
# tls_client_cert_sha256 = ["<64 lowercase hex characters>"]   # with pep_id in the body

[dev]
# DEVELOPMENT ONLY. Mounts POST /admin/root-token, which mints root tokens for a user nobody
# verified (admin bearer + [[root_grants]] only). The server logs a warning when this is on,
# and refuses to start with it when the admin API's listener ([admin] listen, else
# [server] listen) is not a loopback address. Set it to true
# to follow the README quick start or `attenuo token root` on this machine.
allow_root_mint = false
# Demo containers only (the docker-compose demo): accept allow_root_mint although listen is not
# loopback, for a container that binds 0.0.0.0 behind a port published on the host's loopback.
# Never in a deployment.
# allow_root_mint_off_loopback = false

[proxy]
# How often (seconds, at least 1) a long-lived response stream (the GET listen stream, or a
# tools/call answered over SSE) is re-checked against lease state and token expiry. The stream
# is ended at the first failed check, so a revoked or expired token loses it within this time.
stream_recheck_seconds = 2
# Refuse a tools/call whose exact name the upstream never returned from tools/list and the
# catalog does not know (reason tool_not_listed), so an upstream that resolves names
# case-insensitively cannot run delete_repo for "Delete_Repo".
require_listed_tools = true
# How tools/list answers are filtered (ADR-0011, proposed). "capabilities" (the default) keeps
# every tool some capability of the token could permit. "policy" also hides a tool the Cedar
# policy denies for every possible call of this token (no permit can apply, a forbid on token
# facts such as chain depth or MFA, approval obligations lifted so approval-gated tools stay),
# and a tool missing from the catalog under unknown_tools = "deny". Advisory only: a hidden
# tool that is called is still decided and audited.
# list_filter = "policy"
# Memory bounds. An upstream body the proxy must buffer (a JSON list result it filters, one SSE
# event) over max_upstream_body_bytes gets 502; a request body over max_request_body_bytes
# gets 413.
max_upstream_body_bytes = 16777216
max_request_body_bytes = 4194304
# Mcp-Session-Id bindings: idle lifetime, and how many are held. When every slot is live a new
# session gets 503 session_registry_full; live sessions are never evicted to make room.
session_ttl_seconds = 3600
max_sessions = 100000
# Live sessions one principal (one root grant and the agents it delegates to) may hold; one more
# gets 429 too_many_sessions, and other users are unaffected. A session the proxy refuses is
# deleted at the upstream.
max_sessions_per_principal = 64
# Repeated audit records of one condition (a client retrying initialize on a revoked lease, or
# several GET listen streams of one token cut at once): the first per delegation chain, tool and
# reason in each window is recorded, the rest are still refused but only counted in
# audit_records_suppressed_total. One window (seconds, 1 to 3600) for both kinds, and how many
# windows each kind keeps open (100 to 1000000; a full table records rather than suppresses).
record_window_seconds = 60
record_window_max_keys = 10000
# Upstream deadlines. Connecting (1 to 300 s): a failure is 502 upstream_unreachable, nothing
# was sent. Response headers, and a JSON body the proxy buffers, counted from sending (1 to
# 3600 s): past it, 504 upstream_timeout, and the upstream may have acted. An SSE stream that
# has started is never cut by it. Raise it for tools that answer in JSON after a long run.
upstream_connect_timeout_seconds = 5
upstream_response_timeout_seconds = 120

[limits]
# Basic protection of this one process against too much work at once (not a security
# property; every figure is per process, and attenuo runs as a single replica).
# Requests handled at once on the main listener; one more gets 503 overloaded with
# Retry-After: 1 instead of queueing. /healthz and /readyz are never refused. 0: no cap.
max_in_flight = 1024
# Seconds for a request's headers to arrive (also the idle time of a kept-alive connection).
header_read_timeout_seconds = 30
# Seconds for a request body to arrive once the headers are in; past it, 408.
request_body_timeout_seconds = 30
# Seconds for an answer on every route but /mcp/{server} (its streams stay open) and
# /admin/*; past it, 503 request_timeout.
request_timeout_seconds = 60
# Per-caller rate limits, per minute, off (0) by default: POST /token per authenticated
# agent, POST /token that authenticated no agent per peer address (behind a reverse proxy
# every caller shares its address), /mcp/{server} per run (root lease), and AuthZEN action
# search (POST /access/v1/search/action, one `search` audit record each) per run in a table of its own. Over:
# 429 with Retry-After. Pick a few times the busiest legitimate rate.
token_requests_per_minute = 0
token_unauthenticated_requests_per_minute = 0
mcp_requests_per_minute = 0
authzen_search_requests_per_minute = 0
# Callers each rate limit tracks; when all are inside their minute a new one is refused.
rate_limit_max_keys = 10000

[metrics]
# Prometheus text endpoint on its OWN listener (GET /metrics), never on the proxy port.
# No authentication: keep it on loopback or a private network.
enabled = false
# listen = "127.0.0.1:9100"
# A non-loopback `listen` is refused at startup unless this is true (SR-38).
# allow_public = false

[logging]
# The log on standard output. "text" (default) or "json" (one object per line: timestamp,
# level, target, message, the event's fields, and its spans). ATTENUO_LOG_FORMAT overrides it;
# an unknown value refuses to start. RUST_LOG still picks what is logged. ANSI colour only on a
# terminal, in text, and without NO_COLOR.
format = "text"
# Log user subjects as hmac:<16 hex>, the digest trace export uses, instead of in clear.
# The audit log keeps the subject either way.
redact_subjects = false

[telemetry]
# OpenTelemetry trace export over OTLP/HTTP (protobuf). Off by default. Exported spans carry
# decision ids, reason codes, tool names and route templates; never a token, the subject,
# arguments or results. Export fails open: a dead collector never delays a decision.
# See docs/guides/observability.md.
enabled = false
# otlp_endpoint = "http://127.0.0.1:4318"   # /v1/traces is appended; non-loopback must be https
# timeout_seconds = 10
# allow_insecure = false
# service_name = "attenuo-server"
# resource_attributes = { "deployment.environment" = "production" }
# Collector credentials: OTEL_EXPORTER_OTLP_HEADERS, never this file.

# [telemetry.traces]
# sample_ratio = 0.1
# inbound_mcp = "link"         # "link" | "parent" | "ignore"
# inbound_authzen = "parent"   # for [[peps]] callers with HTTP Basic
# propagate_upstream = true
# max_queue_spans = 2048
# max_export_batch = 512

[admin_ui]
# The admin console on its OWN listener (/admin/ui/ plus the admin API, same admin token).
# Read-only unless allow_write; never serves /admin/root-token; no CORS.
enabled = false
# listen = "127.0.0.1:9101"
# A non-loopback `listen` is refused at startup unless this is true.
# allow_public = false
# Mount POST /admin/leases/{id}/revoke, POST /admin/policies/reload, POST /admin/approvals/{id},
# POST /admin/budgets/refund and the operators and agents reloads on this listener.
# allow_write = false
