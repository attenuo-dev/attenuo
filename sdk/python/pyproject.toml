[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "attenuo"
version = "0.1.0"
description = "Python SDK for the attenuo agent authorization server: token exchange, attenuated capabilities, proxied MCP calls, audit."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The attenuo authors" }]
keywords = ["attenuo", "mcp", "agents", "authorization", "delegation", "rfc8693"]
dependencies = ["httpx>=0.25", "rfc8785==0.1.4"]
# No "License ::" classifier: with a PEP 639 `license` expression hatchling rejects one.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.optional-dependencies]
# Local Ed25519 verification of delegation tokens (`Client.inspect(..., verify=True)`).
verify = ["cryptography>=41"]
# DPoP proofs for sender-constrained tokens (`Client(..., dpop_key=...)`).
dpop = ["cryptography>=41"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "cryptography>=41", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/attenuo-dev/attenuo"
Repository = "https://github.com/attenuo-dev/attenuo"
Documentation = "https://github.com/attenuo-dev/attenuo/tree/main/sdk/python"
Issues = "https://github.com/attenuo-dev/attenuo/issues"
Changelog = "https://github.com/attenuo-dev/attenuo/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/attenuo"]

# Only these go into the source distribution. Without the list, hatchling takes every file
# under sdk/python that git does not ignore, tracked or not, so a stray local file (notes, a
# token saved while testing) would be published (SR-61).
[tool.hatch.build.targets.sdist]
include = ["/src/attenuo", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test this checkout's source even when the environment has another checkout installed.
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: runs the real attenuo-server and a fake MCP server (set ATTENUO_INTEGRATION=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
# `src` above is resolved from the working directory when ruff runs with `--config` from the
# repository root; naming the package keeps import sorting the same from either directory.
known-first-party = ["attenuo"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true
