# cargo-deny configuration. https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`; CI runs it in the supply-chain job.
# Written against the version-2 config format (cargo-deny >= 0.14): licenses are
# allow-list only and every RustSec vulnerability is an error by default.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RustSec). Vulnerabilities are always errors.
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
# Each ignore needs an id, a reason, and ideally an expiry so it is revisited.
ignore = [
  # { id = "RUSTSEC-0000-0000", reason = "...", expiry = "2027-01-01" },
]

# ---------------------------------------------------------------------------
# Licenses. Anything not listed is denied.
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
]
unused-allowed-license = "allow"
# Per-crate exceptions go here with a reason, never a blanket allow.
exceptions = [
  # { crate = "some-crate", allow = ["OpenSSL"] },
]

[licenses.private]
ignore = true

# ---------------------------------------------------------------------------
# Bans: duplicate versions and crates we do not want.
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
# Should be "deny". It is "allow" for now because the workspace path
# dependencies (`onbehalf-core = { path = "..." }`) carry no `version`, which
# cargo-deny reports as wildcards for publishable crates. Add
# `version = "0.1.0"` to those entries in the root Cargo.toml (needed for
# crates.io anyway) and flip this back to "deny".
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-wildcard-paths = true
deny = [
  # Prefer rustls; keep native OpenSSL out of the dependency tree.
  { crate = "openssl", reason = "use rustls via reqwest's rustls-tls feature" },
  { crate = "openssl-sys", reason = "use rustls via reqwest's rustls-tls feature" },
  { crate = "native-tls", reason = "use rustls" },
]
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources: only crates.io.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
