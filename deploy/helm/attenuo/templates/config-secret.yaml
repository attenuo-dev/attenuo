{{- include "attenuo.validate" . }}
{{- if .Values.config }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "attenuo.configSecretName" . }}
  labels:
    {{- include "attenuo.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.toml: |
    {{- .Values.config | nindent 4 }}
{{- end }}
