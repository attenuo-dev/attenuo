# Tests for policy.cedar, run offline by `attenuo policy test` (and by run.sh before any server
# traffic). The catalog is read from the demo's server config.
#
# The chains below carry the same capabilities as the demo's tokens, so the capability stage
# runs as it does on the server. Two decisions of the demo are not policy decisions and cannot
# be cases here: the second repository's `budget_exhausted` (run limits are counted by the
# server, before Cedar; the harness keeps no counters) and `lease_revoked` (leases live in the
# server). The refused exchanges are not decisions either; the server refuses to issue them.
policies: ./policy.cedar
catalog: ./config.toml

cases:
  # --- the calls the demo makes ---------------------------------------------------------------
  # The first case defines the planner's token (hop 1) and the coder's (hop 2), as run.sh
  # issues them; the other cases reuse them as *planner and *coder.
  - name: the coder reads a file in acme/api
    chain:
      - &planner
        agent: planner
        capabilities:
          - { server: github, tool: get_file_contents, constraints: { repo: { op: prefix, value: acme/ } } }
          - { server: github, tool: list_issues, constraints: { repo: { op: prefix, value: acme/ } } }
          - { server: github, tool: create_issue, constraints: { repo: { op: prefix, value: acme/ } } }
          - { server: github, tool: create_or_update_file, constraints: { repo: { op: prefix, value: acme/ } } }
      - &coder
        agent: coder
        capabilities:
          - server: github
            tool: get_file_contents
            constraints: { repo: { op: prefix, value: acme/api } }
            limits: { distinct: { arg: repo, max: 1 } }
          - server: github
            tool: create_or_update_file
            constraints: { repo: { op: prefix, value: acme/api } }
            limits: { distinct: { arg: repo, max: 1 } }
    call:
      server: github
      tool: get_file_contents
      arguments: { repo: acme/api, path: src/lib.rs }
    expect: allow
    reason: policy_allow
    policy_ids: [read_in_acme]

  - name: the coder's write to main is refused by policy, though its token allows the write
    chain: [*planner, *coder]
    call:
      server: github
      tool: create_or_update_file
      arguments: { repo: acme/api, path: src/lib.rs, branch: main, content: "fn main() {}" }
    expect: deny
    reason: policy_deny
    policy_ids: [no_writes_to_default_branch]

  - name: a read of a second acme/api repository passes policy (the server's run limit refuses it)
    chain: [*planner, *coder]
    call:
      server: github
      tool: get_file_contents
      arguments: { repo: acme/api-client, path: README.md }
    expect: allow
    reason: policy_allow
    policy_ids: [read_in_acme]

  # --- what the narrowing takes away from the coder ---------------------------------------------
  - name: the coder cannot open issues, the planner did not delegate create_issue
    chain: [*planner, *coder]
    call:
      server: github
      tool: create_issue
      arguments: { repo: acme/api, title: hello }
    expect: deny
    reason: capability_denied

  - name: the coder cannot read acme repositories outside acme/api
    chain: [*planner, *coder]
    call:
      server: github
      tool: get_file_contents
      arguments: { repo: acme/billing, path: README.md }
    expect: deny
    reason: capability_denied

  - name: the coder cannot list issues, even in acme/api
    chain: [*planner, *coder]
    call: { server: github, tool: list_issues, arguments: { repo: acme/api } }
    expect: deny
    reason: capability_denied

  - name: the coder may write to an agent branch
    chain: [*planner, *coder]
    call:
      server: github
      tool: create_or_update_file
      arguments: { repo: acme/api, path: src/lib.rs, branch: agent/fix-typo, content: "// fixed" }
    expect: allow
    reason: policy_allow
    policy_ids: [write_to_agent_branches]

  # --- the planner, with its wider token ---------------------------------------------------------
  - name: the planner reads issues across acme
    chain: [*planner]
    call: { server: github, tool: list_issues, arguments: { repo: acme/billing } }
    expect: allow
    reason: policy_allow
    policy_ids: [read_in_acme]

  - name: the planner opens an issue in acme
    chain: [*planner]
    call: { server: github, tool: create_issue, arguments: { repo: acme/api, title: plan } }
    expect: allow
    reason: policy_allow
    policy_ids: [open_issues_in_acme]

  - name: the planner's token stops at the acme organisation
    chain: [*planner]
    call: { server: github, tool: get_file_contents, arguments: { repo: other/api, path: README.md } }
    expect: deny
    reason: capability_denied

  # --- the policy on its own (hops inherit the call's server:tool) -------------------------------
  - name: reads outside acme get no permit
    chain: [planner]
    call: { server: github, tool: get_file_contents, arguments: { repo: other/api, path: README.md } }
    expect: deny
    reason: policy_deny
    policy_ids: []

  - name: a write without a branch is refused
    chain: [planner]
    call:
      server: github
      tool: create_or_update_file
      arguments: { repo: acme/api, path: src/lib.rs, content: x }
    expect: deny
    reason: policy_deny
    policy_ids: [no_writes_to_default_branch]

  - name: a write to master is refused like one to main
    chain: [planner]
    call:
      server: github
      tool: create_or_update_file
      arguments: { repo: acme/api, path: src/lib.rs, branch: master, content: x }
    expect: deny
    reason: policy_deny
    policy_ids: [no_writes_to_default_branch]

  - name: a third agent below the coder is refused even for a read
    chain: [planner, coder, reviewer]
    call: { server: github, tool: get_file_contents, arguments: { repo: acme/api, path: README.md } }
    expect: deny
    reason: policy_deny
    policy_ids: [forbid_chains_past_the_coder]
