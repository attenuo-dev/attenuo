# onbehalf-server config for the GitHub MCP leak demo (see README.md).
#
# Variant of config.toml for docker-compose.yml: listens on all interfaces inside the container,
# reaches the fake MCP server by service name, and reads the policy mounted at /etc/onbehalf.

[server]
listen = "0.0.0.0:8080"

[issuer]
issuer = "http://127.0.0.1:8080"
audience = "onbehalf"
default_ttl_seconds = 900
# No key path: an ephemeral key per start, which is what a throwaway demo wants.

[policy]
policies_path = "/etc/onbehalf/policy.cedar"

# Every action a policy names must be in the catalog, with the argument types it tests.
[policy.catalog.github.read_file]
readonly = true
inputs = { repo = "string", path = "string" }

[policy.catalog.github.create_issue]
inputs = { repo = "string", title = "string" }

[policy.catalog.github.delete_repo]
sensitive = true
inputs = { repo = "string" }

[audit]
sqlite_path = ":memory:"

[[upstreams]]
name = "github"
url = "http://fake-mcp:3001/mcp"

[admin]
token = "demo-admin-token"

# Alice's assistant holds a broad token, like the over-privileged PAT in the real incident.
[[root_grants]]
subject = "alice"
issuer = "https://idp.example"
agent = "assistant"
capabilities = ["github:*"]

# Demo only: mounts POST /admin/root-token so step 1 works without an identity provider.
# Real deployments leave this off and mint root tokens from an OIDC ID token or ID-JAG.
[dev]
allow_root_mint = true
