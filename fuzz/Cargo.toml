[package]
name = "attenuo-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"
description = "cargo-fuzz targets for attenuo's attacker-reachable parsers and checks"

[package.metadata]
cargo-fuzz = true

# A workspace of its own: cargo-fuzz builds with nightly-only sanitizer flags, so this crate is
# excluded from the main workspace (see the root Cargo.toml and docs/design/fuzzing.md).
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
attenuo-core = { path = "../crates/attenuo-core" }
attenuo-token = { path = "../crates/attenuo-token" }
attenuo-policy = { path = "../crates/attenuo-policy" }
attenuo-audit = { path = "../crates/attenuo-audit" }
attenuo-proxy = { path = "../crates/attenuo-proxy", features = ["fuzzing"] }
attenuo-server = { path = "../crates/attenuo-server" }
serde = "1"
serde_json = "1"
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
base64 = "0.23"
ring = "0.17"
jsonwebtoken = "9"
cedar-policy = "4"
uuid = "1"

[profile.release]
# No debug info: function names are enough for backtraces, and 13 targets add up on disk.
debug = false

[[bin]]
name = "token_verify_bytes"
path = "fuzz_targets/token_verify_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "token_verify_mutated"
path = "fuzz_targets/token_verify_mutated.rs"
test = false
doc = false
bench = false

