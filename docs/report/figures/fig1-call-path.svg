<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" font-family="Helvetica, Arial, DejaVu Sans, sans-serif">
<rect width="840" height="380" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1f23"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b5472f"/></marker></defs>
<rect x="20" y="30" width="130" height="46" rx="6" fill="#ffffff" stroke="#1b1f23" stroke-width="1.3"/>
<text x="85.0" y="50.0" font-size="12.5" text-anchor="middle" fill="#1b1f23" font-weight="600">User and IdP</text>
<text x="85.0" y="65.0" font-size="10.5" text-anchor="middle" fill="#8a9099">logs in, consents</text>
<rect x="20" y="130" width="130" height="46" rx="6" fill="#ffffff" stroke="#1b1f23" stroke-width="1.3"/>
<text x="85.0" y="150.0" font-size="12.5" text-anchor="middle" fill="#1b1f23" font-weight="600">Orchestrator</text>
<text x="85.0" y="165.0" font-size="10.5" text-anchor="middle" fill="#8a9099">agent, hop 0</text>
<rect x="20" y="230" width="130" height="46" rx="6" fill="#ffffff" stroke="#1b1f23" stroke-width="1.3"/>
<text x="85.0" y="250.0" font-size="12.5" text-anchor="middle" fill="#1b1f23" font-weight="600">Sub-agent</text>
<text x="85.0" y="265.0" font-size="10.5" text-anchor="middle" fill="#8a9099">agent, hop 1</text>
<rect x="300" y="20" width="290" height="290" rx="8" fill="#eef1f4" stroke="#1b1f23" stroke-width="1.3"/>
<text x="445" y="42" font-size="13" font-weight="600" text-anchor="middle" fill="#1b1f23">attenuo (token server and MCP proxy)</text>
<rect x="320" y="56" width="250" height="40" rx="6" fill="#ffffff" stroke="#1b1f23" stroke-width="1.3"/>
<text x="445.0" y="73.0" font-size="12.5" text-anchor="middle" fill="#1b1f23">Token exchange (RFC 8693)</text>
<text x="445.0" y="88.0" font-size="10.5" text-anchor="middle" fill="#8a9099">child must be narrower than parent</text>
<text x="445" y="120" font-size="11" text-anchor="middle" fill="#8a9099">checks on every tool call, in order</text>
<rect x="320" y="128" width="250" height="27" rx="4" fill="#ffffff" stroke="#1f8a7d" stroke-width="1.2"/>
<text x="332" y="146" font-size="11.5" fill="#1b1f23">1  token and every hop's lease</text>
<rect x="320" y="162" width="250" height="27" rx="4" fill="#ffffff" stroke="#1f8a7d" stroke-width="1.2"/>
<text x="332" y="180" font-size="11.5" fill="#1b1f23">2  capabilities and run limits</text>
<rect x="320" y="196" width="250" height="27" rx="4" fill="#ffffff" stroke="#1f8a7d" stroke-width="1.2"/>
<text x="332" y="214" font-size="11.5" fill="#1b1f23">3  Cedar policy over the arguments</text>
<rect x="320" y="230" width="250" height="27" rx="4" fill="#ffffff" stroke="#1f8a7d" stroke-width="1.2"/>
<text x="332" y="248" font-size="11.5" fill="#1b1f23">4  approval, if the policy asks</text>
<rect x="320" y="264" width="250" height="27" rx="4" fill="#ffffff" stroke="#1f8a7d" stroke-width="1.2"/>
<text x="332" y="282" font-size="11.5" fill="#1b1f23">5  append decision to the audit log</text>
<rect x="700" y="150" width="120" height="50" rx="6" fill="#ffffff" stroke="#1b1f23" stroke-width="1.3"/>
<text x="760.0" y="172.0" font-size="12.5" text-anchor="middle" fill="#1b1f23" font-weight="600">MCP server</text>
<text x="760.0" y="187.0" font-size="10.5" text-anchor="middle" fill="#8a9099">the tool</text>
<line x1="85" y1="76" x2="85" y2="128" stroke="#1b1f23" stroke-width="1.3" marker-end="url(#a)"/>
<text x="92" y="106" font-size="10.5" text-anchor="start" fill="#1b1f23">ID token</text>
<line x1="85" y1="176" x2="85" y2="228" stroke="#1b1f23" stroke-width="1.3" marker-end="url(#a)"/>
<text x="92" y="206" font-size="10.5" text-anchor="start" fill="#1b1f23">child token</text>
<line x1="150" y1="140" x2="318" y2="68" stroke="#1b1f23" stroke-width="1.3" marker-end="url(#a)"/>
<circle cx="234.0" cy="104.0" r="9" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/>
<text x="234.0" y="108.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1b1f23">A</text>
<line x1="150" y1="166" x2="318" y2="86" stroke="#1b1f23" stroke-width="1.3" marker-end="url(#a)"/>
<circle cx="234.0" cy="126.0" r="9" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/>
<text x="234.0" y="130.0" font-size="11" font-weight="600" text-anchor="middle" fill="#1b1f23">B</text>
<line x1="150" y1="253" x2="318" y2="142" stroke="#1b1f23" stroke-width="1.3" marker-end="url(#a)"/>
<circle cx="234.0" cy="197.5" r="9" fill="#ffffff" stroke="#1b1f23" stroke-width="1.1"/>
<text x="234.0" y="201.5" font-size="11" font-weight="600" text-anchor="middle" fill="#1b1f23">C</text>
<line x1="590" y1="175" x2="698" y2="175" stroke="#1b1f23" stroke-width="1.3" marker-end="url(#a)"/>
<text x="644.0" y="167" font-size="10.5" text-anchor="middle" fill="#1b1f23">allowed calls only</text>
<line x1="590" y1="262" x2="640" y2="262" stroke="#b5472f" stroke-width="1.3" marker-end="url(#r)"/>
<text x="648" y="258" font-size="10.5" fill="#b5472f">denied: an error with a reason</text>
<text x="648" y="272" font-size="10.5" fill="#b5472f">and a decision id; the server</text>
<text x="648" y="286" font-size="10.5" fill="#b5472f">never sees the call</text>
<text x="20" y="336" font-size="11" fill="#1b1f23">A   the user's ID token is exchanged for a root token</text>
<text x="20" y="352" font-size="11" fill="#1b1f23">B   the root token is exchanged for a narrower child token</text>
<text x="20" y="368" font-size="11" fill="#1b1f23">C   the sub-agent calls a tool with the child token</text>
</svg>
