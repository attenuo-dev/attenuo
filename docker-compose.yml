# The GitHub leak demo as two containers: attenuo-server in front of a fake GitHub MCP server.
#
#   docker compose up --build
#
# Then, from the host (the server is published on 127.0.0.1:8080 only):
#
#   export ATTENUO_ADMIN_TOKEN=$(openssl rand -hex 32)   # before `docker compose up`
#   export ATTENUO_SERVER=http://127.0.0.1:8080
#   cargo run -p attenuo-cli -- token root --subject alice --agent assistant --cap 'github:*'
#
# or run the CLI in the same image: docker compose run --rm --entrypoint attenuo attenuo --help
# The scripted walk-through is examples/github-leak-demo/run.sh, which does not need Docker.
# The server listens on all interfaces inside the container, so it refuses to start without a
# strong admin token: compose passes ATTENUO_ADMIN_TOKEN from your shell. For the same reason
# the dev root mint needs the demo-only [dev] allow_root_mint_off_loopback in its config. Never
# publish /admin outside localhost.

services:
  attenuo:
    image: attenuo:dev
    build: .
    command: ["--config", "/etc/attenuo/config.toml"]
    environment:
      ATTENUO_ADMIN_TOKEN: ${ATTENUO_ADMIN_TOKEN:?set ATTENUO_ADMIN_TOKEN, e.g. $(openssl rand -hex 32)}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./examples/github-leak-demo/config.docker.toml:/etc/attenuo/config.toml:ro
      - ./examples/github-leak-demo/policy.cedar:/etc/attenuo/policy.cedar:ro
    depends_on:
      - fake-mcp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  fake-mcp:
    image: attenuo:dev
    entrypoint: ["fake-mcp"]
    command: ["--host", "0.0.0.0", "--port", "3001"]
    expose:
      - "3001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
